<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Opération Bretzel</title>
<meta name="description" content="Jeu de révision d'allemand : la famille, les nombres jusqu'à 99, Wie geht's ? Chaque erreur devient un fantôme à chasser.">
<meta name="theme-color" content="#FFCC00">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A5%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout : une colonne format téléphone (34rem max) de cases de BD, contour encre et ombre dure ; QG sur fond or tramé, missions sur papier blanc tramé. Univers unique, clair et assumé. */
:root{
  color-scheme: light;
  --ink:#000;
  --paper:#fff;
  --gold:#FFCC00;
  --gold-soft:#FFF3BF;
  --red:#E4312B;
  --good:#128A4C;
  --good-bg:#D8F5E4;
  --bad-bg:#FFE0DC;
  --muted:#4E4639;
  --der:#1E5FD0;
  --die:#D8261F;
  --pl:#8436CC;
  --t-cast:#FFCC00;
  --t-fam:#2BB464;
  --t-num:#19BFB0;
  --t-wg:#FF8A1F;
  --t-pr:#FF8CC0;
  --t-blitz:#E4312B;
  --t-mem:#9B7BFF;
  --t-moi:#5C9DFF;
  --t-land:#F25C54;
  --t-hobby:#8BD346;
  --t-konj:#B4BAC6;
  --t-meine:#D9A3FF;
  --t-plur:#4FC3F7;
  --t-ctrl:#FFE14D;
  --t-patch:#FFADAD;
  --t-dict:#7FD1AE;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --outline:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--gold)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;color:var(--ink);
  background-color:var(--gold);background-image:radial-gradient(circle,rgba(0,0,0,.13) 1.3px,transparent 1.7px);background-size:16px 16px}
body.paper{background-color:var(--paper);background-image:radial-gradient(circle,rgba(0,0,0,.07) 1.2px,transparent 1.6px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--der);outline-offset:3px}
.app{max-width:34rem;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px))}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;line-height:1}
.g-der{color:var(--der)}.g-die{color:var(--die)}.g-pl{color:var(--pl)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}

/* ---------- boutons ---------- */
.btn{appearance:none;border:3px solid var(--ink);border-radius:14px;background:var(--gold);box-shadow:0 5px 0 var(--ink);padding:11px 18px 12px;font-family:var(--f-display);font-size:20px;letter-spacing:.3px;cursor:pointer;transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--gold)}
.btn.white{background:var(--paper)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
.icon-btn{appearance:none;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 3px 0 var(--ink);width:44px;height:44px;display:grid;place-items:center;font-size:20px;cursor:pointer;flex:none;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:none}

/* ---------- QG ---------- */
.logo{padding-top:6px}
.logo-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-block;background:var(--ink);color:var(--paper);font-weight:900;font-size:13px;border-radius:8px;padding:3px 10px;transform:rotate(-2deg)}
.title{font-size:clamp(46px,14vw,66px);line-height:.92;color:var(--paper);margin:12px 0 0;letter-spacing:.5px;text-shadow:var(--outline),8px 8px 0 var(--red)}
.title .pretzel{display:inline-block;transform:rotate(-12deg);animation:wobble 2.4s ease-in-out 1}
@keyframes wobble{0%{transform:rotate(-12deg) scale(.4)}25%{transform:rotate(12deg) scale(1.15)}45%{transform:rotate(-8deg)}65%{transform:rotate(4deg)}100%{transform:rotate(-12deg)}}
.pitch{font-weight:800;font-size:16.5px;margin:14px 0 0;max-width:30rem}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.player{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.rank-emo{width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);background:var(--gold-soft);display:grid;place-items:center;font-size:38px;grid-row:span 2}
.rank-name{font-family:var(--f-display);font-size:26px;line-height:1}
.rank-fr{font-weight:700;color:var(--muted);font-size:14px}
.xpbar{grid-column:1/-1;margin-top:10px;height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(-45deg,var(--gold) 0 10px,#FFD83D 10px 20px);border-right:3px solid var(--ink)}
.ranks{grid-column:1/-1;margin-top:12px}
.ranks summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:7px;border:2.5px solid var(--ink);border-radius:999px;padding:5px 13px;background:var(--paper);font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.ranks summary::-webkit-details-marker{display:none}
.ranks summary .rk{background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.ranks[open] summary{background:var(--gold)}
.ranks ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.ranks li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:5px 10px;background:var(--paper)}
.ranks li .e{font-size:23px;text-align:center;line-height:1}
.ranks li b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.1}
.ranks li small{display:block;font-weight:700;color:var(--muted);font-size:12.5px;line-height:1.2}
.ranks li .x{font-weight:900;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ranks li.got{background:var(--gold-soft)}
.ranks li.cur{background:var(--gold);box-shadow:3px 3px 0 var(--ink)}
.ranks li.lock{border-style:dashed;color:var(--muted)}
.ranks li.lock .e{filter:grayscale(1);opacity:.55}
.xpline{grid-column:1/-1;display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.pstats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:13.5px;background:var(--paper);font-variant-numeric:tabular-nums}
.ghostcard{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:6px 6px 0 var(--red)}
.ghostcard h2{font-size:24px;color:var(--gold)}
.ghostcard p{margin:6px 0 12px;font-weight:700;font-size:15px;color:#EDE6D6}
.ghostrow{display:flex;gap:4px;font-size:28px;margin-bottom:6px;flex-wrap:wrap}
.ghostrow span{animation:float 2.6s ease-in-out infinite}
.ghostrow span:nth-child(2n){animation-delay:.4s}
.ghostrow span:nth-child(3n){animation-delay:.9s}
@keyframes float{50%{transform:translateY(-5px)}}
.empty{background:var(--paper)}
.empty h2{font-size:22px}
.empty p{margin:6px 0 0;font-weight:700;color:var(--muted)}
.intro ol{margin:10px 0 12px;padding:0;list-style:none;display:grid;gap:8px}
.intro li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-weight:700}
.intro li b.n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:17px}
.h2{font-size:26px;margin:26px 0 12px;color:var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.worlds>.wt:last-child:nth-child(odd){grid-column:1/-1}
.h2sub{margin:-6px 0 12px;font-weight:800;font-size:14px}
.wt[data-w="patch"] .band{background:conic-gradient(#FFADAD 0 25%,#FDFFB6 0 50%,#A0E7E5 0 75%,#CAFFBF 0) 0 0/36px 36px}
.wt[data-w="land"] .band{background:linear-gradient(180deg,#000 0 33.4%,#DD0000 33.4% 66.7%,#FFCE00 66.7%)}
.wt{appearance:none;position:relative;text-align:left;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:5px 5px 0 var(--ink);padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .06s,box-shadow .06s}
.wt:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.wt .band{background:var(--c);border-bottom:3px solid var(--ink);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:56px}
.wt .band .emo{font-size:30px}
.wt .body{padding:9px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.wt .h{font-family:var(--f-display);font-size:20px;line-height:1.05}
.wt .d{font-size:13.5px;color:var(--muted);font-weight:700;line-height:1.3;flex:1}
.neu{margin-right:auto;font-family:var(--f-display);font-size:15px;line-height:1;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:3px 9px 4px;transform:rotate(-6deg);box-shadow:2px 2px 0 var(--ink);letter-spacing:.5px}
.gh{font-size:13px;font-weight:900;background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 8px;white-space:nowrap}
.stars{font-size:21px;letter-spacing:2px;line-height:1;white-space:nowrap}
.stars .on{color:var(--gold);text-shadow:1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 1.5px 0 var(--ink),0 -1.5px 0 var(--ink)}
.stars .off{color:#fff;text-shadow:1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 1.5px 0 var(--ink),0 -1.5px 0 var(--ink)}
.best{font-size:13.5px;font-weight:900}
.foot{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{appearance:none;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);padding:6px 12px;font-weight:800;font-size:14px;cursor:pointer}
.tog[aria-pressed="false"]{background:transparent;text-decoration:line-through;opacity:.75}
.savenote{font-weight:700;font-size:13.5px}
.reset{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:800;font-size:14px}
.link{appearance:none;background:none;border:none;padding:0;font-weight:800;text-decoration:underline;cursor:pointer;font-size:14px}

/* ---------- mission ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--paper);border-bottom:3px solid var(--ink);margin-inline:-16px;padding-inline:16px}
.prog{flex:1;display:flex;gap:3px;min-width:0}
.seg{flex:1;height:14px;border:2.5px solid var(--ink);border-radius:5px;background:var(--paper);min-width:0}
.seg.ok{background:var(--good)}.seg.ko{background:var(--red)}.seg.cur{background:var(--gold)}
.combo{font-family:var(--f-display);font-size:18px;background:var(--red);color:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:2px 8px;white-space:nowrap}
.combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
.timer{font-family:var(--f-display);font-size:20px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.quitask{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--ink);color:var(--paper);border-radius:14px;padding:8px 12px;font-weight:800;flex-wrap:wrap}
.quitask .btn{font-size:16px;padding:6px 12px}
.qcard{margin-top:14px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px 18px}
.qtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:13px;background:var(--c)}
.gbadge{background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;font-weight:900;font-size:13px}
.ask{margin:14px 0 6px;font-weight:800;color:var(--muted);font-size:16px}
.bigrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:clamp(28px,8.4vw,40px);line-height:1.12;margin:0;min-width:0;overflow-wrap:anywhere}
.big.num{font-size:clamp(64px,22vw,100px);line-height:1}
.big.emoji{font-size:74px;line-height:1.1}
.big.long{font-size:clamp(22px,6.2vw,29px)}
.blank{display:inline-block;min-width:1.8em;border-bottom:4px solid var(--ink);margin-right:.2em}
.say{appearance:none;border:2.5px solid var(--ink);border-radius:50%;width:42px;height:42px;background:var(--gold);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:19px;cursor:pointer;flex:none;padding:0}
.say:active{transform:translateY(3px);box-shadow:none}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{appearance:none;display:flex;align-items:center;gap:10px;text-align:left;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--ink);padding:11px 12px;font-weight:800;font-size:18px;line-height:1.25;cursor:pointer;min-height:58px;min-width:0;transition:transform .06s,box-shadow .06s}
.opt .k{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;background:var(--gold-soft)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.num .t{font-family:var(--f-display);font-weight:400;font-size:28px}
.opt:hover{background:var(--gold-soft)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opts.locked .opt{pointer-events:none}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.right .k{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--red);box-shadow:0 4px 0 var(--red);animation:shake .35s}
.opt.dim{opacity:.4}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tf .opt{justify-content:center;font-family:var(--f-display);font-weight:400;font-size:24px}
.typer{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.typer input{width:100%;font:inherit;font-size:22px;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--paper);color:var(--ink)}
.typer input.ok{border-color:var(--good);background:var(--good-bg)}
.typer input.ko{border-color:var(--red);background:var(--bad-bg);animation:shake .35s}
.keys{display:flex;gap:8px}
.key{appearance:none;flex:1;border:2.5px solid var(--ink);border-radius:12px;background:var(--gold-soft);box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:20px;padding:6px 0;cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:none}
.line{min-height:62px;border:3px dashed var(--ink);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-top:16px;background:#FFFCEB}
.line:empty::before{content:"Touche les étiquettes dans l'ordre…";font-weight:700;color:var(--muted);padding:8px 6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.line.stack,.bank.stack{flex-direction:column;align-items:stretch}
.tile{appearance:none;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 3px 0 var(--ink);padding:8px 12px;font-weight:900;font-size:17px;cursor:pointer;text-align:left}
.tile:active{transform:translateY(3px);box-shadow:none}
.line .tile{background:var(--gold-soft)}
.bank .tile.used{visibility:hidden}
.preview{min-height:22px;margin-top:8px;font-weight:800;color:var(--muted);overflow-wrap:anywhere}
.go{margin-top:14px}
.listen{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.listen .btn{font-size:19px}
.flash{margin-top:12px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:800}
.flash.good{background:var(--good-bg)}.flash.bad{background:var(--bad-bg)}

/* ---------- feuille de correction ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s ease-out}
.sheet.on{transform:none}
.sheet-in{max-width:34rem;margin:0 auto;border:3px solid var(--ink);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow:auto}
.sheet-in.good{background:var(--good-bg)}.sheet-in.bad{background:var(--bad-bg)}
.fb-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.fb-head h3{font-size:28px}
.fb-tr{font-weight:800;font-size:14px;color:var(--muted)}
.xp-chip{margin-left:auto;font-family:var(--f-display);font-size:18px;background:var(--gold);border:2.5px solid var(--ink);border-radius:10px;padding:1px 9px;white-space:nowrap}
.sheet p{margin:8px 0 0}
.fb-ans{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb-why{font-weight:600}
.fb-tip{font-weight:700}
.fb-extra{font-weight:900;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px}
.sheet .btn{margin-top:14px}

/* ---------- résultats ---------- */
.res{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.res-hero{text-align:center}
.res-hero h2{font-size:clamp(44px,13vw,60px);color:var(--paper);text-shadow:var(--outline),7px 7px 0 var(--red)}
.res-hero .tr{font-weight:800;margin-top:8px}
.res-hero .quip{font-weight:700;margin-top:4px}
.bigstars{font-size:54px;letter-spacing:8px;margin-top:6px}
.bigstars span{display:inline-block;animation:starin .5s both}
.bigstars .on{color:var(--red)}.bigstars .off{color:rgba(255,255,255,.6)}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:4px 4px 0 var(--ink)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;font-weight:800}
.rankup{text-align:center;background:var(--red);color:var(--paper);box-shadow:6px 6px 0 var(--ink)}
.rankup .emo{font-size:52px;display:block}
.rankup h3{font-size:26px;margin-top:6px}
.review h3{font-size:22px}
.review ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.review li{border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--paper);display:grid;gap:2px}
.review li .q{font-weight:700;color:var(--muted);font-size:14px}
.review li .a{font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.review li .a .say{width:34px;height:34px;font-size:15px}
.actions{display:grid;gap:12px}

/* ---------- memory ---------- */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.mhead h2{font-size:30px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:480px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mcard{appearance:none;aspect-ratio:3/4;max-width:100%;perspective:700px;border:none;background:none;padding:0;cursor:pointer}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.mcard .f{background:var(--red);font-size:34px;background-image:radial-gradient(circle,rgba(0,0,0,.18) 1.3px,transparent 1.7px);background-size:10px 10px}
.mcard .b{background:var(--paper);transform:rotateY(180deg);font-weight:900;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.mcard .b.de{background:var(--gold-soft)}
.mcard.done .b{background:var(--good-bg);border-color:var(--good)}

/* ---------- confettis ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border:2px solid var(--ink);border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--rot))}}
/* ---------- comptes ---------- */
.logo-top{flex-wrap:wrap;row-gap:8px;column-gap:6px}
.logo-top .tag{white-space:nowrap;padding:3px 8px}
.logo-top .tr{display:flex;align-items:center;gap:6px;min-width:0;margin-left:auto}
.chip-acc{appearance:none;display:inline-flex;align-items:center;gap:5px;min-height:44px;max-width:11.5rem;border:3px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--ink);padding:4px 10px;font-weight:900;font-size:14px;cursor:pointer;color:var(--ink)}
.chip-acc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip-acc:active{transform:translateY(3px);box-shadow:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--gold-soft);border:3px solid var(--ink);border-radius:16px;padding:4px;margin-bottom:4px}
.tab{appearance:none;border:none;border-radius:11px;background:transparent;padding:10px 6px;font-weight:900;font-size:14.5px;line-height:1.2;cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--gold)}
.lbl{display:block;font-weight:900;font-size:15.5px;margin:14px 0 6px}
.field{width:100%;font:inherit;font-size:19px;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;background:var(--paper);color:var(--ink)}
.pw{position:relative}
.pw .field{padding-right:60px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);appearance:none;border:none;background:transparent;width:46px;height:46px;border-radius:10px;font-size:20px;cursor:pointer;display:grid;place-items:center;padding:0}
.eye[aria-pressed="true"]{background:var(--gold-soft)}
.hint{margin:6px 0 0;font-size:13.5px;font-weight:700;color:var(--muted)}
.hint.bad{color:#B4201A}
.hint:empty,.err:empty{display:none}
.err{margin:12px 0 0;font-weight:800;color:#B4201A;background:var(--bad-bg);border:2.5px solid #B4201A;border-radius:12px;padding:8px 12px}
#auth-go{margin-top:16px}
.guestlink{text-align:center;margin-top:20px}
.guestlink .link{font-size:16px}
.small{font-size:13.5px;font-weight:700;margin:6px 0 0}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row .btn{flex:1 1 11rem;font-size:18px}
.guestbar h2,.merge h2{font-size:22px}
.guestbar p,.merge p{margin:6px 0 0;font-weight:700}
.notice{background:var(--good-bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice p{flex:1 1 14rem;margin:0;font-weight:800}
.notice .btn{font-size:16px;padding:6px 16px}
.acc-head{display:flex;align-items:center;gap:14px}
.acc-head .rank-emo{grid-row:auto}
.acc-help{margin-top:12px;border:2.5px dashed var(--ink);border-radius:14px;padding:10px 12px;background:var(--gold-soft);font-weight:700}
.acc-help p{margin:0}
.acc-help .idline{margin-top:6px;font-size:18px;overflow-wrap:anywhere}
#logout{margin-top:14px}
.danger{box-shadow:6px 6px 0 var(--red)}
.danger h2{font-size:22px}
.danger p{font-weight:700;margin:6px 0 0}
.topbar h2{font-size:24px}
@media (max-width:380px){.opts.two{grid-template-columns:1fr}.worlds{gap:10px}.wt .h{font-size:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- grosse mise à jour : série, badges, boss, nouveautés ---------- */
.zz{opacity:.85}
.streak{background:linear-gradient(135deg,#FFF3BF,#FFE0C2)}
.sk-top{display:flex;align-items:center;gap:12px}
.flame{font-size:44px;line-height:1;filter:drop-shadow(2px 2px 0 var(--ink))}
.flame.off{filter:grayscale(1);opacity:.45}
.sk-txt{flex:1;min-width:0}
.sk-n{font-family:var(--f-display);font-size:24px;line-height:1.05}
.sk-d{font-weight:700;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.3}
.sk-best{flex:none;text-align:center;font-weight:800;font-size:12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);padding:4px 8px;line-height:1.15}
.sk-best b{font-family:var(--f-display);font-weight:400;font-size:20px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 14px}
.week>span{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:4px 0 5px;font-size:16px;line-height:1;font-weight:900;color:var(--muted)}
.week>span i{font-style:normal;font-weight:900;font-size:11px;color:var(--muted)}
.week>span.on{background:var(--gold);color:var(--ink)}
.week>span.today{box-shadow:0 0 0 3px var(--red)}
.dailyres{text-align:center;background:var(--gold-soft)}
.dailyres>.emo{font-size:40px;line-height:1}
.dailyres h3{font-size:22px;margin:6px 0 0}
.dailyres p{margin:6px 0 0;font-weight:700}
.badges summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:21px;line-height:1.1}
.badges summary::-webkit-details-marker{display:none}
.badges summary .rk{margin-left:auto;font-family:var(--f-body);font-weight:900;font-size:13px;background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.badges summary:after{content:'▾';font-size:18px}
.badges[open] summary:after{content:'▴'}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:12px}
.bdg{border:2.5px solid var(--ink);border-radius:14px;padding:8px 7px 9px;text-align:center;background:var(--gold-soft);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bdg .emo{font-size:30px;line-height:1.1}
.bdg b{font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.1;overflow-wrap:anywhere}
.bdg small{font-weight:700;font-size:12px;color:var(--muted);line-height:1.25}
.bdg.off{background:var(--paper);border-style:dashed}
.bdg.off .emo{filter:grayscale(1);opacity:.4}
.newbadge{background:var(--gold-soft)}
.newbadge h3{font-size:22px}
.wt.bosst .band{background:linear-gradient(135deg,#2B1B3D,#6B1E3A)}
.wt.bosst .band .emo{font-size:36px;filter:drop-shadow(2px 2px 0 #000)}
.bpv{font-weight:900;font-size:13px;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:2px 9px;white-space:nowrap}
.bossbar{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.bemo{font-size:30px;line-height:1;flex:none}
.bemo.hit{animation:hit .45s}
@keyframes hit{20%{transform:translateX(-5px) rotate(-12deg) scale(.88)}45%{transform:translateX(5px) rotate(10deg)}70%{transform:translateX(-3px)}100%{transform:none}}
.bhp{flex:1;min-width:56px;height:24px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);position:relative;overflow:hidden}
.bhp i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(-45deg,#E4312B 0 10px,#F25C54 10px 20px);transition:width .45s ease-out}
.bhp span{position:relative;z-index:1;display:block;text-align:center;font-weight:900;font-size:12.5px;line-height:18px;font-variant-numeric:tabular-nums}
.hearts{flex:none;font-size:15px;white-space:nowrap;letter-spacing:-1px}
.hearts.lose{animation:shake .4s}
.bosshello{margin-top:12px;background:#2B1B3D;color:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:700;font-size:14.5px;line-height:1.35}
.bosshello .emo{font-size:22px}
.bossbig{font-size:84px;line-height:1;margin:0}
.bossbig.down .emo{display:inline-block;animation:down 1.2s ease-in forwards}
@keyframes down{30%{transform:rotate(-15deg)}100%{transform:rotate(90deg) translateY(12px);opacity:.4;filter:grayscale(1)}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,10,.55);display:grid;place-items:center;padding:16px;animation:fadein .2s}
.modal-in{width:min(30rem,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--red);padding:18px 18px 16px;animation:popin .3s}
.newstag{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:3px 11px;transform:rotate(-3deg);border:2.5px solid var(--ink)}
.modal-in h2{font-size:30px;margin:10px 0 8px}
.newslist{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px}
.newslist li{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;font-weight:700;font-size:15px;line-height:1.35}
.newslist li>.emo{font-size:26px;line-height:1.1}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{transform:scale(.85) translateY(20px);opacity:0}}
@media (prefers-reduced-motion: reduce){.modal,.modal-in,.bemo.hit,.hearts.lose,.bossbig.down .emo{animation:none}}
/* ---------- carte d'aventure + boutique + avatar ---------- */
.coins{font-family:var(--f-display);font-size:18px;background:var(--gold);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.avatar{--av:68px;position:relative;display:inline-grid;place-items:center;width:var(--av);height:var(--av);flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--gold-soft);box-shadow:3px 3px 0 var(--ink)}
.avatar.big{--av:92px}
.avatar.mini{--av:40px;border-width:2.5px;box-shadow:2px 2px 0 var(--ink)}
.a-char{font-size:calc(var(--av) * .6);line-height:1}
.a-hat{position:absolute;left:50%;top:calc(var(--av) * -.26);transform:translateX(-50%) rotate(-10deg);font-size:calc(var(--av) * .44);line-height:1;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}
.a-acc{position:absolute;right:calc(var(--av) * -.16);bottom:calc(var(--av) * -.1);font-size:calc(var(--av) * .4);line-height:1;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}
.rank-av{grid-row:span 2;position:relative;align-self:center;margin-top:8px}
.rank-badge{position:absolute;left:-10px;bottom:-8px;width:32px;height:32px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:18px}
.pbtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.pbtns .btn{font-size:17px;padding:9px 6px 10px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;line-height:1.1;text-align:center}
.coinline{margin:0;text-align:center;font-weight:800}
.coinline .link{font-size:15px}
/* boutique */
.shophead{display:flex;align-items:center;gap:18px;padding-top:26px;margin-top:14px}
.shophead h3{font-size:24px}
.shophead p{margin:4px 0 0;font-weight:700;font-size:14.5px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.sitem{appearance:none;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:0;text-align:center}
.sitem:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.sitem>.emo{font-size:36px;line-height:1.1}
.sitem b{font-size:14px;line-height:1.15;font-weight:800;hyphens:manual;overflow-wrap:anywhere;max-width:100%}
.sitem small{font-size:11.5px;line-height:1.15;font-weight:700;color:var(--muted);margin-top:-3px;overflow-wrap:anywhere;max-width:100%}
.shophead .dds{font-size:13px;color:var(--muted);margin-top:6px}
.sitem .st{font-weight:900;font-size:13px;border-radius:999px;padding:1px 9px;border:2px solid var(--ink);background:var(--gold-soft);white-space:nowrap}
.sitem .st.on{background:var(--good);color:#fff}
.sitem .st.price{background:var(--gold)}
.sitem .st.price.nope{background:#eee;color:var(--muted)}
.sitem.on{background:var(--gold-soft);box-shadow:4px 4px 0 var(--good)}
.sitem.nope{animation:shake .4s}
.swatch{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--sw)}
.swatch.night{background:radial-gradient(circle,rgba(255,255,255,.85) 1px,transparent 1.7px) 0 0/10px 10px,#1F2A4D}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:60;width:max-content;max-width:min(30rem,calc(100vw - 32px));background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 16px;font-weight:800;box-shadow:4px 4px 0 var(--red);transition:transform .25s ease-out;pointer-events:none;text-align:center}
.toast.on{transform:translate(-50%,0)}
/* carte */
.maphead{display:flex;align-items:flex-start;gap:16px;padding-top:24px;margin-top:14px}
.maphead>div{flex:1;min-width:0}
.maphead h3{font-size:22px}
.maphead p{margin:4px 0 0;font-weight:700;font-size:14.5px}
.maphead .msmall{font-size:12.5px;color:var(--muted);margin-top:8px}
.maphead .xpbar{margin-top:10px}
.mapbox{position:relative;margin:18px -4px 0;border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;
  background:radial-gradient(circle at 20% 12%,rgba(255,255,255,.5) 0 60px,transparent 61px),radial-gradient(circle at 85% 40%,rgba(255,255,255,.4) 0 80px,transparent 81px),radial-gradient(circle at 15% 72%,rgba(255,255,255,.35) 0 70px,transparent 71px),linear-gradient(180deg,#BFE9B4,#A4DCA2 45%,#A9D6EC 100%)}
.mpath{position:absolute;inset:0;width:100%;height:100%}
.mpath path{fill:none;stroke-width:9;stroke-linecap:round;vector-effect:non-scaling-stroke}
.mpath .todo{stroke:#fff;stroke-dasharray:2 16;opacity:.95}
.mpath .done{stroke:var(--gold);stroke-width:10}
.mband{position:absolute;left:10px;right:10px;display:flex;justify-content:center;z-index:2}
.mband span{background:var(--ink);color:var(--gold);font-family:var(--f-display);font-size:16px;border-radius:999px;padding:4px 14px;box-shadow:3px 3px 0 rgba(0,0,0,.25);text-align:center}
.mstop{appearance:none;position:absolute;left:0;right:0;height:100px;transform:translateY(-50%);background:none;border:none;padding:0;cursor:pointer;z-index:1}
.mstop .pin{position:absolute;left:var(--x);top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;box-shadow:4px 4px 0 var(--ink)}
.mstop .pin>.emo{font-size:32px}
.mstop.boss .pin{width:82px;height:82px;background:linear-gradient(135deg,#2B1B3D,#6B1E3A)}
.mstop.boss .pin>.emo{font-size:42px}
.mstop.done .pin{background:var(--gold)}
.mstop.boss.done .pin{background:linear-gradient(135deg,#FFCC00,#FF8A1F)}
.mstop.lock .pin{background:#DAD5C8}
.mstop.lock .pin>.emo{filter:grayscale(1);opacity:.45}
.mstop .lk{position:absolute;right:-6px;bottom:-6px;font-size:20px}
.mstop .ok{position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:14px}
.mstop.cur .pin{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:4px 4px 0 var(--ink),0 0 0 9px rgba(228,49,43,.35)}}
.mstop .me{position:absolute;left:50%;top:-36px;transform:translateX(-50%);animation:hop 1.4s ease-in-out infinite}
@keyframes hop{50%{transform:translate(-50%,-6px)}}
.mstop .mlab{position:absolute;top:50%;transform:translateY(-50%);max-width:220px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:6px 9px 7px;text-align:left;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;gap:1px}
.mstop.left .mlab{left:calc(var(--x) + 44px);width:calc(100% - var(--x) - 54px)}
.mstop.right .mlab{right:calc(100% - var(--x) + 44px);width:calc(var(--x) - 54px)}
.mstop.boss.left .mlab{left:calc(var(--x) + 52px);width:calc(100% - var(--x) - 62px)}
.mstop.boss.right .mlab{right:calc(100% - var(--x) + 52px);width:calc(var(--x) - 62px)}
.mlab b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.1;overflow-wrap:anywhere}
.mlab>span{font-weight:700;font-size:12.5px;color:var(--muted);line-height:1.2}
.mlab .mstat .stars{font-size:15px}
.mlab .go{color:var(--red);font-weight:900}
.mstop.lock .mlab{opacity:.78;border-style:dashed}
.mstop.cur .mlab{background:var(--gold-soft)}
.mend{position:absolute;left:12px;right:12px;text-align:center;font-weight:800;font-size:13.5px;color:var(--ink)}
.mapnew{background:#DFF5D8}
.mapnew h3{font-size:22px}
.mapnew p{margin:6px 0 10px;font-weight:700}
.newslist li.soon{background:var(--gold-soft);border:2.5px dashed var(--ink);border-radius:14px;padding:6px 8px}
.newslist .new{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:900;padding:1px 7px;margin-left:4px;vertical-align:2px}
/* fonds d'écran achetés à la boutique */
html[data-bg="sky"],body[data-bg="sky"]:not(.paper){background-color:#8FD3FF}
html[data-bg="mint"],body[data-bg="mint"]:not(.paper){background-color:#9BE8C8}
html[data-bg="candy"],body[data-bg="candy"]:not(.paper){background-color:#FFB3D9}
html[data-bg="night"]{background-color:#1F2A4D}
body[data-bg="night"]:not(.paper){background-color:#1F2A4D;background-image:radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1.7px),radial-gradient(circle,rgba(255,255,255,.25) 1px,transparent 1.6px);background-size:46px 46px,23px 23px;background-position:0 0,11px 13px}
body[data-bg="night"]:not(.paper) :is(.h2,.h2sub,.pitch,.savenote,.reset,.reset .link,.res-hero .tr,.res-hero .quip,.coinline,.coinline .link){color:#F3EEDF}
@media (prefers-reduced-motion: reduce){.mstop.cur .pin,.mstop .me{animation:none}}
</style>
</head>
<body>

<main class="app" id="app">
  <section id="scr-home" aria-label="QG"></section>
  <section id="scr-play" hidden aria-label="Mission"></section>
  <section id="scr-result" hidden aria-label="Résultats"></section>
  <section id="scr-memory" hidden aria-label="Memory"></section>
  <section id="scr-auth" hidden aria-label="Connexion"></section>
  <section id="scr-account" hidden aria-label="Mon compte"></section>
  <section id="scr-map" hidden aria-label="Carte d'aventure"></section>
  <section id="scr-shop" hidden aria-label="Boutique"></section>
</main>

<script src="firebase-config.js" onerror="window.__cfgMissing=true"></script>
<script>
'use strict';
/* =========================================================
   Outils
   ========================================================= */

function numWhy(n){

  else if(!u){s=`${n} = ${U[t]} + zig → <b>${de(n)}</b>.`;if(n===20)s='20 = <b>zwanzig</b>. ⚠️ Exception : jamais « zweizig » !';if(n===30)s='30 = <b>dreißig</b>. ⚠️ Exception : avec un ß, et pas de « zig » !';if(n===60)s+=' ⚠️ sechs perd son s.';if(n===70)s+=' ⚠️ sieben perd son -en.';}
  else{s=`${n} = <b>${u===1?'ein':U[u]}</b> + und + <b>${TENS[t]}</b> → <b>${de(n)}</b>. À l'envers : « ${FRU[u]}-et-${FRT[t]} ».`;if(u===1)s+=' ⚠️ eins perd son s devant und.';if(t===2)s+=' (20 = zwanzig, jamais « zweizig ».)';if(t===3)s+=' (30 = dreißig, avec ß.)';if(t===6)s+=' (60 = sechzig, sans s.)';if(t===7)s+=' (70 = siebzig, sans -en.)';}
  return s;
}

function numWordDistractors(n){
  const t=Math.floor(n/10),u=n%10,right=de(n),c=[],fakes=[];
  const add=x=>{if(x&&x!==right&&!c.includes(x))c.push(x);};
  const uw=u===1?'ein':U[u];
  if(n>20&&u){
    const sw=u*10+t;if(sw>20&&sw%10&&sw!==n)add(de(sw));
    if(u===1)fakes.push('einsund'+TENS[t]);
    if(t===2)fakes.push(uw+'undzweizig');
    if(t===3)fakes.push(uw+'unddreizig');
    if(t===6)fakes.push(uw+'undsechszig');
    if(t===7)fakes.push(uw+'undsiebenzig');
    add(de(u<9?n+1:n-1));add(de(t<9?n+10:n-10));add(de(t>2?n-10:n+20));
  }else if(n>=13&&n<=19){
    if(n===16)fakes.push('sechszehn');if(n===17)fakes.push('siebenzehn');
    add(de(u*10));add(de(n===19?18:n+1));add(de(n===13?14:n-1));
  }else if(n>=20&&!u){
    const f={20:'zweizig',30:'dreizig',60:'sechszig',70:'siebenzig'}[n];if(f)fakes.push(f);
    add(de(10+t));add(de(n===90?80:n+10));add(de(n===20?30:n-10));
  }else{add(de((n+1)%13));add(de((n+2)%13));add(de((n+5)%13));}
  const out=[];if(fakes.length)out.push(pick(fakes));
  for(const x of shuffle(c)){if(out.length>=3)break;if(!out.includes(x))out.push(x);}
  while(out.length<3){const r=de(1+rnd(99));if(r!==right&&!out.includes(r))out.push(r);}
  return out;
}
function numDigitDistractors(n){
  const t=Math.floor(n/10),u=n%10,c=new Set();
  if(u&&t&&n>20)c.add(u*10+t);c.add(n+(u<9?1:-1));c.add(n+(t<9?10:-10));
  if(n>=13&&n<=19)c.add(u*10);if(n>=20&&!u)c.add(10+t);c.add(n>50?n-20:n+20);c.delete(n);
  const out=shuffle([...c].filter(x=>x>=0&&x<100)).slice(0,3);
  while(out.length<3){const r=1+rnd(99);if(r!==n&&!out.includes(r))out.push(r);}
  return out;
}

/* ---------- Konjugation (15, 17 et 21 sept.) ---------- */
const VERBS=[
  {inf:'spielen',st:'spiel',fr:'jouer'},{inf:'wohnen',st:'wohn',fr:'habiter'},{inf:'kommen',st:'komm',fr:'venir'},
  {inf:'schwimmen',st:'schwimm',fr:'nager'},{inf:'malen',st:'mal',fr:'dessiner'},{inf:'hören',st:'hör',fr:'écouter'},
  {inf:'singen',st:'sing',fr:'chanter'},{inf:'machen',st:'mach',fr:'faire'},{inf:'wandern',st:'wander',fr:'faire de la randonnée'}
];
const VERBK=Object.fromEntries(VERBS.map(v=>[v.inf,v]));
const PERS={ich:{p:'ich',end:'e'},du:{p:'du',end:'st'},er:{p:'er',end:'t'},sie:{p:'sie (= elle)',say:'sie',end:'t'}};
function konjForm(p){const [inf,pk]=String(p).split('.');const v=VERBK[inf],P=PERS[pk];if(!v||!P)return null;
  const forms={e:v.st+'e',st:v.st+'st',t:v.st+'t'};return{v,P,pk,forms,ans:forms[P.end]};}
GEN['konj.f']=p=>{const c=konjForm(p);if(!c)return null;const {v,P,forms,ans}=c;
  return{kind:'mcq',ask:`Conjugue « ${v.inf} » (${v.fr}) :`,big:`${P.p} ___`,bigLang:'de',opts:[forms.e,forms.st,forms.t,v.inf],answer:ans,optLang:'de',say:`${P.say||P.p} ${ans}`,
    why:`${P.say||P.p} → radical <b>${v.st}</b> + <b>-${P.end}</b> = <b>${P.say||P.p} ${ans}</b>.`};};
GEN['konj.t']=p=>{const c=konjForm(p);if(!c)return null;const {v,P,ans}=c;
  return{kind:'type',ask:'Écris le verbe conjugué :',big:`${P.p} ___ (${v.inf})`,accept:[ans],say:`${P.say||P.p} ${ans}`,
    why:`${P.say||P.p} → radical <b>${v.st}</b> + <b>-${P.end}</b> = <b>${P.say||P.p} ${ans}</b>.`};};

/* ---------- conjugaison au pluriel : comme l'infinitif ---------- */
const PLV=[
  {inf:'spielen',fr:'jouer',sg:['spiele','spielst','spielt'],obj:'Schach'},
  {inf:'schwimmen',fr:'nager',sg:['schwimme','schwimmst','schwimmt']},
  {inf:'wohnen',fr:'habiter',sg:['wohne','wohnst','wohnt'],obj:'in Berlin'},
  {inf:'kommen',fr:'venir',sg:['komme','kommst','kommt'],obj:'aus Österreich'},
  {inf:'tanzen',fr:'danser',sg:['tanze','tanzt','tanzt'],x:'tanzst'},
  {inf:'singen',fr:'chanter',sg:['singe','singst','singt']},
  {inf:'malen',fr:'dessiner',sg:['male','malst','malt']},
  {inf:'hören',fr:'écouter',sg:['höre','hörst','hört'],obj:'Musik'},
  {inf:'machen',fr:'faire',sg:['mache','machst','macht'],obj:'Fotos'},
  {inf:'wandern',fr:'faire de la randonnée',sg:['wandere','wanderst','wandert']},
  {inf:'lesen',fr:'lire',sg:['lese','liest','liest'],x:'lest',fort:true},
  {inf:'fahren',fr:'aller, rouler',sg:['fahre','fährst','fährt'],obj:'Ski',fort:true}
];
const PLVK=Object.fromEntries(PLV.map(v=>[v.inf,v]));
const PLP={wir:{p:'wir',fr:'nous'},siepl:{p:'sie (= ils, elles)',say:'sie',fr:'ils / elles'}};
function plurForm(p){const [inf,pk]=String(p).split('.');const v=PLVK[inf],P=PLP[pk];if(!v||!P)return null;return{v,P,who:P.say||P.p};}
function plurWhy(v,who){
  return v.fort
    ?`Au pluriel, pas de changement de voyelle : <b>${who} ${v.inf}</b> (comme l'infinitif). Le ${v.inf==='lesen'?'ie':'ä'} n'arrive qu'avec du et er.`
    :`Au pluriel, le verbe ressemble à l'infinitif : <b>${who} ${v.inf}</b>.`;
}
GEN['plur.f']=p=>{const c=plurForm(p);if(!c)return null;const {v,P,who}=c;
  const wrong=[...new Set([...v.sg,v.x].filter(Boolean))].filter(f=>f!==v.inf).slice(0,3);
  return{kind:'mcq',ask:`Conjugue « ${v.inf} » (${v.fr}) au pluriel :`,big:`${P.p} ___${v.obj?' '+v.obj:''}`,bigLang:'de',opts:[v.inf,...wrong],answer:v.inf,optLang:'de',
    say:`${who} ${v.inf}${v.obj?' '+v.obj:''}`,why:plurWhy(v,who)};};
GEN['plur.t']=p=>{const c=plurForm(p);if(!c)return null;const {v,P,who}=c;
  return{kind:'type',ask:'Écris le verbe conjugué :',big:`${P.p} ___ (${v.inf})`,accept:[v.inf],say:`${who} ${v.inf}`,why:plurWhy(v,who)};};

const DAY=86400000;
const dayStart=(n=0)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime();};
const ymd=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const today=()=>ymd(Date.now());
const ymdDate=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12);};
const ymdShift=(s,n)=>{const d=ymdDate(s);d.setDate(d.getDate()+n);return ymd(d.getTime());};
const daysFromToday=t=>{const d=new Date(t);d.setHours(0,0,0,0);return Math.round((d.getTime()-dayStart(0))/DAY);};
function whenTxt(t){const d=daysFromToday(t);if(d<=0)return 'aujourd\'hui';if(d===1)return 'demain';if(d===7)return 'dans une semaine';return `dans ${d} jours`;}

function dictTip(de){
  if(/ß/.test(de))return 'ß se dit « ss ». Sur le clavier du jeu, il y a une touche ß (sinon, écris ss).';
  if(/[äöü]/i.test(de))return 'Pense aux trémas : ä se dit « è », ö se dit « eu », ü se dit « u ».';
  if(/\b(der|die|mein|meine|einen|keine) [A-ZÄÖÜ]/.test(de)||/^[A-ZÄÖÜ][a-zäöüß]+$/.test(de))return 'En allemand, tous les noms prennent une majuscule.';
  if(/ie/.test(de))return 'ie se dit « i » (et ei se dit « aï »).';
  if(/ei/.test(de))return 'ei se dit « aï ».';
  if(/w/i.test(de))return 'w se dit « v ».';
  if(/z/.test(de))return 'z se dit « ts ».';

function merge(base,o){
  if(!o||typeof o!=='object')return base;
  for(const k of Object.keys(base)){
    if(o[k]===undefined)continue;
    if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))base[k]=Object.assign({},base[k],o[k]);

}

function combine(a,b){
  const o=merge(fresh(),JSON.parse(JSON.stringify(a)));
  o.xp=(a.xp||0)+(b.xp||0);
  for(const [w,n] of Object.entries(b.stars||{}))o.stars[w]=Math.max(o.stars[w]||0,n||0);
  for(const [id,g] of Object.entries(b.ghosts||{})){const c=o.ghosts[id];o.ghosts[id]=c?Object.assign({},c,{fails:Math.max(c.fails||1,g.fails||1),hp:Math.min(c.hp||2,g.hp||2),stage:Math.min(gStage(c),gStage(g)),due:Math.min(c.due||0,g.due||0)}):g;}
  o.best.blitz=Math.max(o.best.blitz||0,(b.best&&b.best.blitz)||0);
  const m=[o.best.memory,b.best&&b.best.memory].filter(x=>x>0);o.best.memory=m.length?Math.min(...m):0;
  for(const k of Object.keys(o.stats))o.stats[k]=(o.stats[k]||0)+((b.stats&&b.stats[k])||0);
  o.seenIntro=!!(a.seenIntro||b.seenIntro);
  o.best.combo=Math.max(o.best.combo||0,(b.best&&b.best.combo)||0);
  const sa=a.streak||{},sb=b.streak||{},ss=(sb.last||'')>(sa.last||'')?sb:sa;
  o.streak={days:ss.days||0,last:ss.last||'',best:Math.max(sa.best||0,sb.best||0,ss.days||0)};
  o.badges=Object.assign({},b.badges||{},a.badges||{});
  for(const [k,v] of Object.entries(b.boss||{})){const c=o.boss[k]||{};o.boss[k]={wins:Math.max(c.wins||0,v.wins||0),tries:Math.max(c.tries||0,v.tries||0)};}
  o.news=(a.news===NEWS_ID||b.news===NEWS_ID)?NEWS_ID:(a.news||b.news||'');
  const pa=a.shop||{},pb=b.shop||{},bLast=(pb.eqAt||0)>(pa.eqAt||0);
  o.shop={owned:Object.assign({},pb.owned||{},pa.owned||{}),bonus:(pa.bonus||0)+(pb.bonus||0),eq:Object.assign({char:'bear',hat:'',acc:'',bg:'gold'},bLast?pa.eq||{}:pb.eq||{},bLast?pb.eq||{}:pa.eq||{}),eqAt:Math.max(pa.eqAt||0,pb.eqAt||0)};
  o.shop.spent=spentOf(o.shop);
  o.mapDone=Object.assign({},b.mapDone||{},a.mapDone||{});o.mapInit=!!(a.mapInit||b.mapInit);
  return o;
}

/* Deux appareils ont changé des choses chacun de son côté : on garde la version x
   et on y ajoute ce que y a gagné ou acheté (achats, carte, badges, boss, étoiles, série,
   pop-up déjà fermé), pour que rien ne disparaisse. */
function keepBoth(x,y){
  if(!x||!y)return x;
  if(y.news===NEWS_ID)x.news=NEWS_ID;
  x.seenIntro=!!(x.seenIntro||y.seenIntro);
  x.stars=x.stars||{};for(const [w,n] of Object.entries(y.stars||{}))x.stars[w]=Math.max(x.stars[w]||0,n||0);
  x.badges=Object.assign({},y.badges||{},x.badges||{});
  x.boss=x.boss||{};for(const [k,v] of Object.entries(y.boss||{})){const c=x.boss[k]||{};x.boss[k]=Object.assign({},c,{wins:Math.max(c.wins||0,v.wins||0),tries:Math.max(c.tries||0,v.tries||0)});}
  const sx=x.streak||{},sy=y.streak||{},ss=(sy.last||'')>(sx.last||'')?sy:sx;
  x.streak={days:ss.days||0,last:ss.last||'',best:Math.max(sx.best||0,sy.best||0,ss.days||0)};
  x.mapDone=Object.assign({},y.mapDone||{},x.mapDone||{});x.mapInit=!!(x.mapInit||y.mapInit);
  if(!x.shop||typeof x.shop!=='object')x.shop={};
  const px=x.shop,py=(y.shop&&typeof y.shop==='object')?y.shop:{};
  px.owned=Object.assign({},py.owned||{},px.owned||{});
  px.bonus=Math.max(px.bonus||0,py.bonus||0);
  if((py.eqAt||0)>(px.eqAt||0)){px.eq=Object.assign({},py.eq||{});px.eqAt=py.eqAt;}
  px.spent=spentOf(px);
  return x;
}

function authMsg(e){

  if(/invalid-credential|wrong-password|user-not-found|invalid-login-credentials|invalid-email|user-mismatch/.test(c))return 'Identifiant ou mot de passe incorrect.';

  if(c.includes('network-request-failed'))return 'Pas de connexion internet ? Vérifie ta connexion, puis réessaie.';
  if(/operation-not-allowed|admin-restricted-operation/.test(c))return 'Les comptes ne sont pas encore activés dans Firebase (Authentication, méthode « E-mail/Mot de passe »).';
  if(/api-key-not-valid|invalid-api-key/.test(c))return 'La configuration Firebase est incorrecte : vérifie firebase-config.js.';
  if(c.includes('requires-recent-login'))return 'Déconnecte-toi, reconnecte-toi, puis recommence.';
  return 'Ça n\'a pas marché ('+(c||'erreur inconnue')+'). Réessaie.';
}
function fsMsg(e){
  const c=String((e&&e.code)||'');
  if(c==='permission-denied')return 'Firestore refuse l\'accès : vérifie les règles (étape 6 du guide).';
  if(c==='not-found')return 'La base Firestore n\'existe pas encore (étape 6 du guide).';
  if(c==='unavailable'||c==='deadline-exceeded')return 'Hors ligne : ta progression sera envoyée au retour d\'internet.';
  if(c==='unauthenticated')return 'Session expirée : reconnecte-toi.';
  return 'Sauvegarde en ligne impossible pour le moment ('+(c||'erreur')+').';
}

const Sync={
  timer:null,busy:false,again:false,lastOk:0,err:'',blocked:false,pulled:false,pulling:null,
  can(){return !this.blocked&&profile.type==='account'&&!!Acc.user&&Acc.user.uid===profile.uid&&!!Acc.db;},
  ref(){return Acc.F.doc(Acc.db,'joueurs',profile.uid);},
  reset(){clearTimeout(this.timer);this.pulled=false;this.pulling=null;this.lastOk=0;this.err='';this.again=false;},
  later(){if(!this.can())return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),2000);},
  async flush(){clearTimeout(this.timer);if(this.can())await this.run();},
  async run(){if(!this.pulled)return syncFromCloud();if(isDirty())return this.push();},
  async push(){
    // On n'envoie jamais avant d'avoir lu la version en ligne : sinon un nouvel appareil pourrait l'écraser.
    if(!this.can()||!this.pulled)return;
    if(this.busy){this.again=true;return;}
    this.busy=true;
    const uid=profile.uid,r0=state.rev||0,t=Date.now();
    const prog=JSON.parse(JSON.stringify(state));SYNC_FIELDS.forEach(k=>delete prog[k]);
    try{
      await Acc.F.setDoc(this.ref(),{pseudo:profile.pseudo||'',progress:prog,updatedAt:t});
      if(profile.uid===uid){state.syncedRev=Math.max(state.syncedRev||0,r0);state.syncBase=t;writeLocal();}
      this.lastOk=Date.now();this.err='';
    }catch(e){this.err=fsMsg(e);}
    this.busy=false;
    if(this.again){this.again=false;if(isDirty())await this.push();}
    renderSave();
  },
  async pull(){const snap=await Acc.F.getDoc(this.ref());return snap.exists()?snap.data():null;}
};
function syncFromCloud(){
  if(!Sync.can())return Promise.resolve();
  if(Sync.pulling)return Sync.pulling;
  Sync.pulling=(async()=>{
    const uid=profile.uid;
    try{
      const r=await Sync.pull();
      if(profile.uid!==uid)return;
      Sync.pulled=true;Sync.err='';Sync.lastOk=Date.now();
      if(!r||!r.progress){await Sync.push();return;}
      const Rt=r.updatedAt||0,local=state;
      const take=(x,dirty)=>{for(const k of KEEP_KEYS)if(r.progress&&r.progress[k]===undefined&&local[k]!==undefined)x[k]=JSON.parse(JSON.stringify(local[k]));x.settings=Object.assign({},fresh().settings,local.settings);x.syncBase=Rt;x.rev=dirty?1:0;x.syncedRev=0;state=x;writeLocal();refresh();};
      if(!local.syncBase){
        // Premier contact de cet appareil avec ce compte : ce qui a été joué ici s'ajoute à la version en ligne.
        if(isDirty()&&hasProgress(local)){take(combine(merge(fresh(),r.progress),local),true);await Sync.push();}
        else take(merge(fresh(),r.progress),false);
      }else if(Rt===local.syncBase){if(isDirty())await Sync.push();}
      else if(!isDirty())take(merge(fresh(),r.progress),false);
      else if((local.xp||0)>=((r.progress&&r.progress.xp)||0)){
        // Les deux ont changé : on garde cette version-ci et on y ajoute ce qui a été gagné ou acheté sur l'autre appareil.
        keepBoth(local,merge(fresh(),r.progress));local.syncBase=Rt;writeLocal();refresh();await Sync.push();}
      else{take(keepBoth(merge(fresh(),r.progress),local),true);await Sync.push();}
    }catch(e){Sync.err=fsMsg(e);}
    finally{Sync.pulling=null;renderSave();}
  })();
  return Sync.pulling;
}
async function onUser(u){
  Acc.ready=true;

    const pend=Acc.pending;Acc.pending=null;
    Acc.user=u;Sync.blocked=false;
    const pseudo=(pend&&pend.display)||u.displayName||String(u.email||'').split('@')[0];
    if(!(profile.type==='account'&&profile.uid===u.uid)){
      const settings=state.settings;
      let next=readLocal(accKey(u.uid));
      Acc.notice='';
      if(pend&&pend.signup){
        const guest=readLocal(KEY);
        if(hasProgress(guest)){next=guest;lsDel(KEY);Acc.notice=`Identifiant créé ! Tes ${guest.xp} XP sont maintenant sauvegardés dans ton compte.`;}
        else Acc.notice='Identifiant créé ! Ta progression sera sauvegardée automatiquement.';
        next=next||fresh();next.syncBase=0;next.rev=(next.rev||0)+1;next.syncedRev=0;
      }
      state=next||fresh();state.settings=Object.assign({},fresh().settings,settings);
      profile={type:'account',uid:u.uid,pseudo};
      Sync.reset();
      writeLocal();
      Acc.mergeOffer=!(pend&&pend.signup)&&hasProgress(readLocal(KEY));
    }else if(pseudo)profile.pseudo=pseudo;
    lsSet(LAST_KEY,JSON.stringify({uid:u.uid,pseudo:profile.pseudo}));
    if(screen==='auth'){show('home');renderHome();}else refresh();
    await syncFromCloud();
  }else{
    Acc.user=null;
    if(profile.type==='account'){
      clearTimeout(Sync.timer);
      if(!isDirty()||Acc.wipe)lsDel(accKey(profile.uid));
      lsDel(LAST_KEY);
      const settings=state.settings;
      profile={type:'guest',uid:null,pseudo:''};
      state=readLocal(KEY)||fresh();state.settings=settings;
      Acc.mergeOffer=false;Sync.reset();
    }
    Sync.blocked=false;Acc.wipe=false;
    refresh();
  }
}

const Voice={voice:null,ok:false,
  init(){
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;
    const pickV=()=>{let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
      const d=vs.filter(v=>/^de([-_]|$)/i.test(v.lang||''));
      this.voice=d.find(v=>/de[-_]DE/i.test(v.lang))||d[0]||null;
      const was=this.ok;this.ok=!!this.voice;if(was!==this.ok&&screen==='home')renderHome();};
    pickV();
    try{speechSynthesis.addEventListener('voiceschanged',pickV);}catch(e){}
  },
  say(text,slow,force){
    if(!this.ok||(!state.settings.voice&&!force)||!text)return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=this.voice;u.lang=this.voice.lang;u.rate=slow?.6:.92;speechSynthesis.speak(u);}catch(e){}
  }
};
const Sfx={ctx:null,
  play(kind){
    if(!state.settings.sound)return;
    try{
      this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();
      const c=this.ctx;if(c.state==='suspended')c.resume();
      const seq={good:[660,880],bad:[196,147],ghost:[523,659,784,1047],rank:[523,659,784,1047,1319],combo:[784,988,1175],tick:[1200]}[kind]||[440];
      let t=c.currentTime;
      seq.forEach(f=>{const o=c.createOscillator(),g=c.createGain();o.type=kind==='bad'?'square':'triangle';o.frequency.value=f;
        g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='bad'?.08:.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.17);
        o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.19);t+=kind==='bad'?.13:.085;});
    }catch(e){}
  }
};
function confetti(n=46){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='confetti';
  const cols=['#FFCC00','#E4312B','#19BFB0','#2BB464','#FF8CC0','#FF8A1F','#1E5FD0'];
  for(let i=0;i<n;i++){const s=document.createElement('i');s.style.left=(Math.random()*100)+'%';s.style.background=cols[i%cols.length];
    s.style.animationDelay=(Math.random()*.35)+'s';s.style.setProperty('--dx',((Math.random()*2-1)*140)+'px');s.style.setProperty('--rot',(Math.random()*900-450)+'deg');box.appendChild(s);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2600);
}

function updatePseudoHint(){
  if(authMode!=='signup')return;
  const inp=$('#f-pseudo'),h=$('#pseudo-hint');if(!inp||!h)return;
  const raw=inp.value.trim(),k=pseudoKey(raw),p=raw?pseudoProblem(raw):'';
  h.classList.toggle('bad',!!p);
  h.textContent=p||(raw&&k!==raw?`Ton identifiant sera : ${k} (majuscules et accents ne comptent pas).`:PSEUDO_RULE);
}
async function submitAuth(){
  if(authBusy)return;
  const su=authMode==='signup',raw=$('#f-pseudo').value,pass=$('#f-pass').value;
  const fail=m=>{const el=$('#auth-err');if(el)el.textContent=m;};
  fail('');
  if(!raw.trim())return fail('Tape ton identifiant.');
  const prob=pseudoProblem(raw);
  if(su&&prob)return fail(prob);
  if(!pass)return fail('Tape ton mot de passe.');
  if(su&&pass.length<6)return fail('Mot de passe trop court : au moins 6 caractères.');
  if(!su&&prob)return fail('Identifiant ou mot de passe incorrect.');
  authBusy=true;
  const go=$('#auth-go'),label=go.textContent;go.disabled=true;go.textContent=su?'Création…':'Connexion…';
  try{
    await Acc.loading;
    if(!Acc.A)throw{code:'load'};
    const email=pseudoEmail(pseudoKey(raw));
    if(su){
      Acc.pending={signup:true,display:raw.trim()};
      try{
        const cred=await Acc.A.createUserWithEmailAndPassword(Acc.auth,email,pass);
        try{await Acc.A.updateProfile(cred.user,{displayName:raw.trim()});}catch(e){}
      }catch(e){
        Acc.pending=null;
        if(!String(e&&e.code).includes('email-already-in-use'))throw e;
        // Identifiant déjà pris : si le mot de passe est le bon, c'était le sien → on le connecte.
        try{await Acc.A.signInWithEmailAndPassword(Acc.auth,email,pass);}catch(e2){throw e;}
      }
    }else await Acc.A.signInWithEmailAndPassword(Acc.auth,email,pass);
    authDraft='';
  }catch(e){
    Acc.pending=null;
    fail(e&&e.code==='load'?Acc.loadErr:(su&&String(e&&e.code).includes('invalid-email')?'Cet identifiant n\'est pas accepté. Essaie-en un autre.':authMsg(e)));
  }
  authBusy=false;
  const g2=$('#auth-go');if(g2){g2.disabled=false;g2.textContent=label;}
}

/* ---------- Construction d'une mission ---------- */
function poolFor(w){
  const ids=Object.keys(STATIC).filter(id=>STATIC[id].world===w);
  if(w==='pr'&&Voice.ok)ids.push(...sample(LW,4).map(x=>'pr.listen.'+x));
  return ids;
}
function pickWorld(w,n,exclude){
  const ok=id=>!exclude.includes(id);
  if(w==='num'){
    const trap=shuffle([16,17,20,21,30,60,70,52,48,99,31,66,77,71,13,19]);
    const rn=()=>{const r=Math.random();if(r<.15)return 1+rnd(12);if(r<.3)return 13+rnd(7);if(r<.45)return(2+rnd(8))*10;return 21+rnd(79);};
    const comp=()=>{let x;do{x=21+rnd(79);}while(x%10===0);return x;};
    const st=shuffle(Object.keys(STATIC).filter(id=>STATIC[id].world==='num'));
    const ids=[`num.d2w.${trap[0]}`,`num.w2d.${rn()}`,`num.d2w.${rn()}`,`num.type.${trap[1]}`,`num.dig.${comp()}`,`num.build.${comp()}`,`num.w2d.${trap[2]}`,Voice.ok?`num.listen.${rn()}`:`num.d2w.${trap[3]}`,st[0],st[1],st[2]];
    return shuffle([...new Set(ids)].filter(ok)).slice(0,n);
  }
  if(w==='fam'){
    const words=shuffle(FAM.map(f=>f.k));
    const gen=['fr2de','de2fr','gen','fr2de','de2fr','type','gen'].map((k,i)=>`fam.${k}.${words[i]}`);
    const st=shuffle(Object.keys(STATIC).filter(id=>STATIC[id].world==='fam')).slice(0,4);
    return shuffle([...gen,...st].filter(ok)).slice(0,n);
  }
  if(w==='hobby'){
    const hs=shuffle(HOB.map(h=>h.k));
    const gen=['emo','fr2de','de2fr','emo'].map((k,i)=>`hobby.${k}.${hs[i]}`).filter(ok);
    return shuffle([...gen,...pickStatics(w,n-gen.length,exclude)]).slice(0,n);
  }
  if(w==='konj'){
    const vs=shuffle(VERBS.map(v=>v.inf)),ps=['ich','du','er','sie'];
    const gen=[0,1,2,3].map(i=>`konj.f.${vs[i]}.${ps[i]}`);gen.push(`konj.t.${vs[4]}.${pick(ps)}`);
    const g2=gen.filter(ok);
    return shuffle([...g2,...pickStatics(w,n-g2.length,exclude,{type:1})]).slice(0,n);
  }
  if(w==='plur'){
    const vs=shuffle(PLV.map(v=>v.inf)),ps=shuffle(['wir','siepl','wir','siepl']);
    const gen=[0,1,2].map(i=>`plur.f.${vs[i]}.${ps[i]}`);gen.push(`plur.t.${vs[3]}.${ps[3]}`);
    const g2=gen.filter(ok);
    return shuffle([...g2,...pickStatics(w,n-g2.length,exclude,{type:1})]).slice(0,n);
  }
  if(w==='dict'){
    const rec=shuffle(DICT.filter(d=>RECENT_W.includes(d.w))),old=shuffle(DICT.filter(d=>!RECENT_W.includes(d.w)));
    return shuffle([...rec.slice(0,4),...old].map(d=>'dict.w.'+d.k).filter(ok).slice(0,n));
  }
  if(w==='patch'){
    const ws=shuffle(PATCH.map(f=>f.k));
    const gen=['fr2de','de2fr','gen','type'].map((k,i)=>`patch.${k}.${ws[i]}`);
    const g2=gen.filter(ok);
    return shuffle([...g2,...pickStatics(w,n-g2.length,exclude,{type:1})]).slice(0,n);
  }
  if(w==='exam'){
    /* contrôle du 15 octobre : Patchworkfamilie, pluriel + mögen, Meine Familie, Die Familie */
    const out=[];const ex=()=>[...exclude,...out];
    const take=(ids,k)=>{for(const id of shuffle(ids)){if(out.length>=n||k<=0)break;if(!ex().includes(id)){out.push(id);k--;}}};
    take([`patch.${pick(['fr2de','de2fr','gen'])}.${pick(PATCH).k}`],1);
    take(pickStatics('patch',5,ex()),2);
    take([`plur.f.${pick(PLV).inf}.${pick(['wir','siepl'])}`],1);
    take(pickStatics('plur',5,ex()),2);
    take(pickStatics('meine',5,ex()),2);
    take(pickWorld('fam',5,ex()),2);
    return shuffle(out).slice(0,n);
  }
  return pickStatics(w,n,exclude);
}
function pickStatics(w,n,exclude,caps){
  const ok=id=>!exclude.includes(id);
  const capK=Object.assign({tf:2,build:2,type:2,listen:3},caps||{}),cnt={},out=[];
  for(const id of shuffle(poolFor(w)).filter(ok)){const k=kindOf(id);if(capK[k]&&(cnt[k]||0)>=capK[k])continue;cnt[k]=(cnt[k]||0)+1;out.push(id);if(out.length>=n)break;}
  return out;
}
function toItems(ids){
  const out=[];
  for(const id of ids){const q=getQ(id);if(q)out.push({id,q});else if(state.ghosts[id]){delete state.ghosts[id];}}
  return out;
}

/* ---------- Réponse ---------- */
function norm(s){return String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?¿¡;:«»"()]/g,' ').replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/\s+/g,' ').trim();}
const noUml=s=>norm(s).replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
function checkTyped(given,q){
  const g=norm(given);if(!g)return{ok:false,empty:true};
  for(const a of q.accept){if(norm(a)===g){const clean=x=>String(x).trim().replace(/[.!?]+$/,'').replace(/\s+/g,' ');return{ok:true,exact:clean(given)===clean(a)};}}
  for(const a of q.accept){if(noUml(a)===noUml(given))return{ok:false,near:'uml'};}
  for(const a of q.accept){const m=String(a).match(/^(der|die) (.+)$/);if(m&&norm(m[2])===g)return{ok:false,near:'art'};}
  return{ok:false};
}
function onAnswer(ok,info={}){
  if(run.answered)return;run.answered=true;
  const it=run.queue[run.i],q=it.q,id=it.id;
  it.res=ok;
  if(!it.reask)run.first[id]=ok;
  state.stats.answered++;if(ok)state.stats.correct++;
  let gain=0,ghostLine='',extra='';
  const had=state.ghosts[id];
  if(ok){
    run.combo++;run.maxCombo=Math.max(run.maxCombo,run.combo);state.best.combo=Math.max(state.best.combo||0,run.combo);
    if(q.dict)state.stats.dict=(state.stats.dict||0)+1;
    gain=10+Math.min(10,2*(run.combo-1));
    if(had){
      if(isDue(had)&&!it.reask){
        const st=gStage(had)+1;
        if(st>=GHOST_GAPS.length){delete state.ghosts[id];run.slain++;state.stats.slain++;gain+=15;ghostLine='💥 Fantôme vaincu pour de bon ! +15 XP';Sfx.play('ghost');confetti(30);}
        else{Object.assign(had,{stage:st,due:dayStart(GHOST_GAPS[st]),hp:st>=GHOST_GAPS.length-1?1:2,u:Date.now()});gain+=5;const left=GHOST_GAPS.length-st;
          ghostLine=`👻 Touché ! (+5 XP) Il reviendra ${whenTxt(had.due)} : encore ${left} victoire${left>1?'s':''} et il disparaît.`;}
      }else ghostLine=`👻 Bien joué ! Le fantôme reviendra ${whenTxt(had.due)} pour vérifier que tu t'en souviens.`;
    }
    if([3,5,8,10,15].includes(run.combo)){extra=run.combo>=8?`🔥 Combo x${run.combo} : Unglaublich ! (= incroyable)`:`🔥 Combo x${run.combo} !`;Sfx.play('combo');}
    else if(!ghostLine)Sfx.play('good');
  }else{
    run.combo=0;
    state.ghosts[id]={hp:2,fails:((had&&had.fails)||0)+1,world:q.world,t:Date.now(),stage:0,due:dayStart(GHOST_GAPS[0]),u:Date.now()};
    if(!had)run.newGhosts++;
    if(run.mode!=='blitz'&&!run.reasked.has(id)){
      run.reasked.add(id);
      const pos=Math.min(run.i+4,run.queue.length);
      run.queue.splice(pos,0,{id,q:getQ(id),reask:true});
      ghostLine='👻 Un fantôme est né ! Il revient dans quelques questions, puis demain, dans 3 jours et dans une semaine.';
    }else ghostLine='👻 Fantôme ! Il reviendra demain pour une revanche.';
    Sfx.play('bad');
  }
  run.xp+=gain;state.xp+=gain;
  if(run.mode==='boss')extra=(extra?extra+'<br>':'')+bossHit(ok);
  const rNow=rankIdx(state.xp);
  if(rNow>run.rank0){extra=(extra?extra+'<br>':'')+`🎉 Nouveau rang : ${esc(RANKS[rNow].de)} ${RANKS[rNow].emo} (= ${esc(RANKS[rNow].fr)})`;run.rank0=rNow;run.rankUp=rNow;Sfx.play('rank');confetti();}
  save();
  if(run.mode==='blitz'){blitzAfter(ok,q);return;}
  const prog=$('#prog');if(prog)prog.innerHTML=progHtml();
  const cb=$('#combo');if(cb){cb.hidden=run.combo<2;cb.textContent=`🔥 x${run.combo}`;cb.classList.remove('pop');void cb.offsetWidth;cb.classList.add('pop');}
  showSheet(ok,gain,q,info,ghostLine,extra);
}
const CHEERS=[['Genau !','exactement','🎯'],['Super !','super','🥨'],['Sehr gut !','très bien','🌟'],['Wunderbar !','merveilleux','✨'],['Klasse !','la classe','😎'],['Prima !','parfait','👍'],['Toll !','génial','🎉'],['Ausgezeichnet !','excellent','🏆']];
const OOPS=[['Hoppla !','oups','😅'],['Schade !','dommage','🙈'],['Oh nein !','oh non','😱'],['Fast !','presque','🤏']];
function showSheet(ok,gain,q,info,ghostLine,extra){
  const h=ok?pick(CHEERS):(info.near?OOPS[3]:pick(OOPS.slice(0,3)));

    <div class="fb-head"><h3>${h[0]} <span class="emo">${h[2]}</span></h3><span class="fb-tr">(= ${h[1]})</span>${gain?`<span class="xp-chip">+${gain} XP</span>`:''}</div>
    ${!ok||q.kind==='build'||q.kind==='type'?`<p class="fb-ans">${ok?'Réponse':'La bonne réponse'} : <span>${q.kind==='tf'?ans:(q.optLang==='num'?esc(ans):fmtDe(ans))}</span> ${sayBtn(sayTxt)}</p>`:(sayTxt&&Voice.ok?`<p class="fb-ans">${sayBtn(sayTxt)} <span style="font-weight:700;font-size:15px">${fmtDe(sayTxt)}</span></p>`:'')}

/* ---------- Fin de mission ---------- */
function finish(){
  const vals=Object.values(run.first);const good=vals.filter(Boolean).length,total=vals.length;
  const pct=total?good/total:0;
  const stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  let bonus=0;
  if(run.mode!=='blitz'&&total>=5){bonus+=20;if(stars===3)bonus+=20;}
  if(run.mode==='daily'){run.daily=dailyDone();bonus+=run.daily.bonus;}
  run.xp+=bonus;state.xp+=bonus;
  if(run.mode==='world')state.stars[run.world]=Math.max(state.stars[run.world]||0,stars);
  state.stats.rounds++;
  const rNow=rankIdx(state.xp);if(rNow>run.rank0){run.rankUp=rNow;run.rank0=rNow;}
  run.newBadges=checkBadges();
  run.newStops=checkMap();
  save();Sync.flush();
  renderResult({good,total,stars,pct,bonus});
}
function verdict(pct){
  if(pct>=1)return['Perfekt !','parfait','Même Kurt, 52 ans d\'expérience, n\'a jamais vu ça.'];
  if(pct>=.8)return['Sehr gut !','très bien','Tu parles presque comme Sandra.'];
  if(pct>=.6)return['Gut !','bien','Pas mal du tout. Les fantômes attendent leur revanche.'];
  if(pct>=.4)return['Na ja…','bof, bof','Ça rentre ! Chasse tes fantômes pour progresser.'];
  return['Kopf hoch !','garde la tête haute','L\'allemand s\'apprend en se trompant. Tes fantômes vont t\'aider.'];
}

/* ---------- Fantômes : panneau du QG ---------- */
function ghostPanel(gd,all){

/* ---------- Série de jours + défi du jour ---------- */
function streakView(){
  const s=state.streak||{},t=today(),y=ymdShift(t,-1);
  const alive=s.last===t||s.last===y,days=alive?(s.days||0):0,done=s.last===t;
  const start=alive&&days?ymdShift(s.last,-(days-1)):'';
  const week=[...Array(7)].map((_,i)=>{const d=ymdShift(t,i-6);return{d,l:'DLMMJVS'[ymdDate(d).getDay()],on:!!(start&&d>=start&&d<=s.last),today:d===t};});
  return{days,done,best:s.best||0,week,nextBonus:20+5*Math.min(done?days:days+1,10)};
}
function streakPanel(){
  const v=streakView();
  return `<section class="panel streak" aria-label="Ta série de jours">
    <div class="sk-top"><span class="flame emo ${v.days?'':'off'}">🔥</span>
      <div class="sk-txt"><div class="sk-n">${v.days} jour${v.days>1?'s':''} d'affilée</div>
        <div class="sk-d">${v.done?'Défi du jour réussi ! Reviens demain pour garder ta flamme.':v.days?'Fais le défi du jour (5 questions) pour garder ta flamme !':'Fais le défi du jour (5 questions) pour allumer ta flamme !'}</div></div>
      <span class="sk-best">Record<br><b>${v.best}</b></span></div>
    <div class="week" aria-hidden="true">${v.week.map(d=>`<span class="${d.on?'on':''}${d.today?' today':''}"><i>${d.l}</i>${d.on?'<span class="emo">🔥</span>':'·'}</span>`).join('')}</div>
    <button class="btn ${v.done?'white':''} full" data-act="daily">${v.done?'Rejouer le défi (sans bonus)':`Défi du jour : +${v.nextBonus} XP`}</button>
  </section>`;
}
function startDaily(){
  const all=THEMES.flatMap(t=>t.worlds);
  const ids=dueGhostIds().slice(0,2);
  const plan=[RECENT_W[0],pick(RECENT_W.slice(1)),pick(all.filter(w=>!RECENT_W.includes(w)))];
  if(Voice.ok)plan.push('dict');
  for(const w of plan){if(ids.length>=5)break;ids.push(...pickWorld(w,1,ids));}
  let guard=0;while(ids.length<5&&guard++<30)ids.push(...pickWorld(pick(all),1,ids));
  run=newRun('daily',null,toItems(shuffle([...new Set(ids)].slice(0,5))));
  if(!run.queue.length){run=null;renderHome();return;}
  show('play');renderQ();
}
function dailyDone(){
  const s=state.streak=Object.assign({days:0,best:0,last:''},state.streak),t=today();
  if(s.last===t)return{days:s.days,bonus:0,again:true};
  s.days=s.last===ymdShift(t,-1)?(s.days||0)+1:1;s.last=t;s.best=Math.max(s.best||0,s.days);
  state.stats.daily=(state.stats.daily||0)+1;
  return{days:s.days,bonus:20+5*Math.min(s.days,10),again:false};
}
const dailyHtml=d=>`<section class="panel dailyres"><span class="emo">🔥</span><h3>${d.again?'Défi déjà réussi aujourd\'hui':`Série : ${d.days} jour${d.days>1?'s':''} d'affilée !`}</h3><p>${d.again?'Bon entraînement ! Le prochain défi arrive demain.':`+${d.bonus} XP de bonus. Reviens demain pour continuer ta série.`}</p></section>`;

}

/* ---------- Bretzels et avatar ---------- */
const shopState=()=>{
  /* on complète l'objet sur place (sans le remplacer) pour que les achats restent bien enregistrés */
  if(!state.shop||typeof state.shop!=='object')state.shop={};const s=state.shop;
  if(!s.owned||typeof s.owned!=='object')s.owned={};if(typeof s.spent!=='number')s.spent=0;if(typeof s.bonus!=='number')s.bonus=0;
  if(!s.eq||typeof s.eq!=='object')s.eq={};for(const [k,v] of Object.entries({char:'bear',hat:'',acc:'',bg:'gold'}))if(s.eq[k]===undefined)s.eq[k]=v;
  return s;};
/* ce qui a été dépensé = la somme des prix des objets achetés (comme ça, une fusion ne compte jamais un achat deux fois) */
const spentOf=s=>Object.keys((s&&s.owned)||{}).reduce((t,id)=>t+((SHOPK[id]&&SHOPK[id].price)||0),0);
const coins=()=>{const s=shopState();return Math.max(0,Math.floor((state.xp||0)/10)+(s.bonus||0)-spentOf(s));};
const owns=id=>{const it=SHOPK[id];return !!it&&(it.price===0||!!shopState().owned[id]);};
function avatarHtml(cls=''){

}

function renderShop(){

function mapStatus(){
  let open=true;
  return MAP_STOPS.map((st,i)=>{const done=st.boss?((state.boss[st.boss]||{}).wins||0)>=1:(state.stars[st.w]||0)>=1;const o={st,i,done,open};open=open&&done;return o;});
}
function checkMap(){
  state.mapDone=state.mapDone||{};const init=!state.mapInit,out=[];
  for(const m of mapStatus()){if(m.done&&m.open&&!state.mapDone[m.st.id]){state.mapDone[m.st.id]=Date.now();if(!init){shopState().bonus+=MAP_BONUS;out.push(m.st);}}}
  state.mapInit=true;
  return out;
}
const stopName=st=>st.boss?`Boss : ${BOSSES[st.boss].name}`:WORLDS[st.w].name;
