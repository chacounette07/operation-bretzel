<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Opération Bretzel</title>
<meta name="description" content="Jeu de révision d'allemand : la famille, les nombres jusqu'à 99, Wie geht's ? Chaque erreur devient un fantôme à chasser.">
<meta name="theme-color" content="#FFCC00">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A5%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout : une colonne format téléphone (34rem max) de cases de BD, contour encre et ombre dure ; QG sur fond or tramé, missions sur papier blanc tramé. Univers unique, clair et assumé. */
:root{
  color-scheme: light;
  --ink:#000;
  --paper:#fff;
  --gold:#FFCC00;
  --gold-soft:#FFF3BF;
  --red:#E4312B;
  --good:#128A4C;
  --good-bg:#D8F5E4;
  --bad-bg:#FFE0DC;
  --muted:#4E4639;
  --der:#1E5FD0;
  --die:#D8261F;
  --pl:#8436CC;
  --t-cast:#FFCC00;
  --t-fam:#2BB464;
  --t-num:#19BFB0;
  --t-wg:#FF8A1F;
  --t-pr:#FF8CC0;
  --t-blitz:#E4312B;
  --t-mem:#9B7BFF;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --outline:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--gold)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;color:var(--ink);
  background-color:var(--gold);background-image:radial-gradient(circle,rgba(0,0,0,.13) 1.3px,transparent 1.7px);background-size:16px 16px}
body.paper{background-color:var(--paper);background-image:radial-gradient(circle,rgba(0,0,0,.07) 1.2px,transparent 1.6px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--der);outline-offset:3px}
.app{max-width:34rem;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px))}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400;line-height:1}
.g-der{color:var(--der)}.g-die{color:var(--die)}.g-pl{color:var(--pl)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}

/* ---------- boutons ---------- */
.btn{appearance:none;border:3px solid var(--ink);border-radius:14px;background:var(--gold);box-shadow:0 5px 0 var(--ink);padding:11px 18px 12px;font-family:var(--f-display);font-size:20px;letter-spacing:.3px;cursor:pointer;transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--gold)}
.btn.white{background:var(--paper)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
.icon-btn{appearance:none;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 3px 0 var(--ink);width:44px;height:44px;display:grid;place-items:center;font-size:20px;cursor:pointer;flex:none;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:none}

/* ---------- QG ---------- */
.logo{padding-top:6px}
.logo-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-block;background:var(--ink);color:var(--paper);font-weight:900;font-size:13px;border-radius:8px;padding:3px 10px;transform:rotate(-2deg)}
.title{font-size:clamp(46px,14vw,66px);line-height:.92;color:var(--paper);margin:12px 0 0;letter-spacing:.5px;text-shadow:var(--outline),8px 8px 0 var(--red)}
.title .pretzel{display:inline-block;transform:rotate(-12deg);animation:wobble 2.4s ease-in-out 1}
@keyframes wobble{0%{transform:rotate(-12deg) scale(.4)}25%{transform:rotate(12deg) scale(1.15)}45%{transform:rotate(-8deg)}65%{transform:rotate(4deg)}100%{transform:rotate(-12deg)}}
.pitch{font-weight:800;font-size:16.5px;margin:14px 0 0;max-width:30rem}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.player{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.rank-emo{width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);background:var(--gold-soft);display:grid;place-items:center;font-size:38px;grid-row:span 2}
.rank-name{font-family:var(--f-display);font-size:26px;line-height:1}
.rank-fr{font-weight:700;color:var(--muted);font-size:14px}
.xpbar{grid-column:1/-1;margin-top:10px;height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(-45deg,var(--gold) 0 10px,#FFD83D 10px 20px);border-right:3px solid var(--ink)}
.xpline{grid-column:1/-1;display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.pstats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:13.5px;background:var(--paper);font-variant-numeric:tabular-nums}
.ghostcard{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:6px 6px 0 var(--red)}
.ghostcard h2{font-size:24px;color:var(--gold)}
.ghostcard p{margin:6px 0 12px;font-weight:700;font-size:15px;color:#EDE6D6}
.ghostrow{display:flex;gap:4px;font-size:28px;margin-bottom:6px;flex-wrap:wrap}
.ghostrow span{animation:float 2.6s ease-in-out infinite}
.ghostrow span:nth-child(2n){animation-delay:.4s}
.ghostrow span:nth-child(3n){animation-delay:.9s}
@keyframes float{50%{transform:translateY(-5px)}}
.empty{background:var(--paper)}
.empty h2{font-size:22px}
.empty p{margin:6px 0 0;font-weight:700;color:var(--muted)}
.intro ol{margin:10px 0 12px;padding:0;list-style:none;display:grid;gap:8px}
.intro li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-weight:700}
.intro li b.n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:17px}
.h2{font-size:26px;margin:26px 0 12px;color:var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.worlds>.wt:last-child:nth-child(odd){grid-column:1/-1}
.wt{appearance:none;position:relative;text-align:left;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:5px 5px 0 var(--ink);padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .06s,box-shadow .06s}
.wt:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.wt .band{background:var(--c);border-bottom:3px solid var(--ink);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:56px}
.wt .band .emo{font-size:30px}
.wt .body{padding:9px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.wt .h{font-family:var(--f-display);font-size:20px;line-height:1.05}
.wt .d{font-size:13.5px;color:var(--muted);font-weight:700;line-height:1.3;flex:1}
.gh{font-size:13px;font-weight:900;background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 8px;white-space:nowrap}
.stars{font-size:21px;letter-spacing:2px;line-height:1;white-space:nowrap}
.stars .on{color:var(--gold);text-shadow:1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 1.5px 0 var(--ink),0 -1.5px 0 var(--ink)}
.stars .off{color:#fff;text-shadow:1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 1.5px 0 var(--ink),0 -1.5px 0 var(--ink)}
.best{font-size:13.5px;font-weight:900}
.foot{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{appearance:none;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);padding:6px 12px;font-weight:800;font-size:14px;cursor:pointer}
.tog[aria-pressed="false"]{background:transparent;text-decoration:line-through;opacity:.75}
.savenote{font-weight:700;font-size:13.5px}
.reset{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:800;font-size:14px}
.link{appearance:none;background:none;border:none;padding:0;font-weight:800;text-decoration:underline;cursor:pointer;font-size:14px}

/* ---------- mission ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--paper);border-bottom:3px solid var(--ink);margin-inline:-16px;padding-inline:16px}
.prog{flex:1;display:flex;gap:3px;min-width:0}
.seg{flex:1;height:14px;border:2.5px solid var(--ink);border-radius:5px;background:var(--paper);min-width:0}
.seg.ok{background:var(--good)}.seg.ko{background:var(--red)}.seg.cur{background:var(--gold)}
.combo{font-family:var(--f-display);font-size:18px;background:var(--red);color:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:2px 8px;white-space:nowrap}
.combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.3) rotate(-6deg)}}
.timer{font-family:var(--f-display);font-size:20px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.quitask{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--ink);color:var(--paper);border-radius:14px;padding:8px 12px;font-weight:800;flex-wrap:wrap}
.quitask .btn{font-size:16px;padding:6px 12px}
.qcard{margin-top:14px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px 18px}
.qtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:13px;background:var(--c)}
.gbadge{background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;font-weight:900;font-size:13px}
.ask{margin:14px 0 6px;font-weight:800;color:var(--muted);font-size:16px}
.bigrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:clamp(28px,8.4vw,40px);line-height:1.12;margin:0;min-width:0;overflow-wrap:anywhere}
.big.num{font-size:clamp(64px,22vw,100px);line-height:1}
.big.emoji{font-size:74px;line-height:1.1}
.big.long{font-size:clamp(22px,6.2vw,29px)}
.blank{display:inline-block;min-width:1.8em;border-bottom:4px solid var(--ink);margin-right:.2em}
.say{appearance:none;border:2.5px solid var(--ink);border-radius:50%;width:42px;height:42px;background:var(--gold);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:19px;cursor:pointer;flex:none;padding:0}
.say:active{transform:translateY(3px);box-shadow:none}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{appearance:none;display:flex;align-items:center;gap:10px;text-align:left;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--ink);padding:11px 12px;font-weight:800;font-size:18px;line-height:1.25;cursor:pointer;min-height:58px;min-width:0;transition:transform .06s,box-shadow .06s}
.opt .k{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;background:var(--gold-soft)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.num .t{font-family:var(--f-display);font-weight:400;font-size:28px}
.opt:hover{background:var(--gold-soft)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opts.locked .opt{pointer-events:none}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.right .k{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--red);box-shadow:0 4px 0 var(--red);animation:shake .35s}
.opt.dim{opacity:.4}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tf .opt{justify-content:center;font-family:var(--f-display);font-weight:400;font-size:24px}
.typer{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.typer input{width:100%;font:inherit;font-size:22px;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--paper);color:var(--ink)}
.typer input.ok{border-color:var(--good);background:var(--good-bg)}
.typer input.ko{border-color:var(--red);background:var(--bad-bg);animation:shake .35s}
.keys{display:flex;gap:8px}
.key{appearance:none;flex:1;border:2.5px solid var(--ink);border-radius:12px;background:var(--gold-soft);box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:20px;padding:6px 0;cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:none}
.line{min-height:62px;border:3px dashed var(--ink);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-top:16px;background:#FFFCEB}
.line:empty::before{content:"Touche les étiquettes dans l'ordre…";font-weight:700;color:var(--muted);padding:8px 6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.line.stack,.bank.stack{flex-direction:column;align-items:stretch}
.tile{appearance:none;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 3px 0 var(--ink);padding:8px 12px;font-weight:900;font-size:17px;cursor:pointer;text-align:left}
.tile:active{transform:translateY(3px);box-shadow:none}
.line .tile{background:var(--gold-soft)}
.bank .tile.used{visibility:hidden}
.preview{min-height:22px;margin-top:8px;font-weight:800;color:var(--muted);overflow-wrap:anywhere}
.go{margin-top:14px}
.listen{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.listen .btn{font-size:19px}
.flash{margin-top:12px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:800}
.flash.good{background:var(--good-bg)}.flash.bad{background:var(--bad-bg)}

/* ---------- feuille de correction ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s ease-out}
.sheet.on{transform:none}
.sheet-in{max-width:34rem;margin:0 auto;border:3px solid var(--ink);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow:auto}
.sheet-in.good{background:var(--good-bg)}.sheet-in.bad{background:var(--bad-bg)}
.fb-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.fb-head h3{font-size:28px}
.fb-tr{font-weight:800;font-size:14px;color:var(--muted)}
.xp-chip{margin-left:auto;font-family:var(--f-display);font-size:18px;background:var(--gold);border:2.5px solid var(--ink);border-radius:10px;padding:1px 9px;white-space:nowrap}
.sheet p{margin:8px 0 0}
.fb-ans{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb-why{font-weight:600}
.fb-tip{font-weight:700}
.fb-extra{font-weight:900;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px}
.sheet .btn{margin-top:14px}

/* ---------- résultats ---------- */
.res{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.res-hero{text-align:center}
.res-hero h2{font-size:clamp(44px,13vw,60px);color:var(--paper);text-shadow:var(--outline),7px 7px 0 var(--red)}
.res-hero .tr{font-weight:800;margin-top:8px}
.res-hero .quip{font-weight:700;margin-top:4px}
.bigstars{font-size:54px;letter-spacing:8px;margin-top:6px}
.bigstars span{display:inline-block;animation:starin .5s both}
.bigstars .on{color:var(--red)}.bigstars .off{color:rgba(255,255,255,.6)}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:4px 4px 0 var(--ink)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;font-weight:800}
.rankup{text-align:center;background:var(--red);color:var(--paper);box-shadow:6px 6px 0 var(--ink)}
.rankup .emo{font-size:52px;display:block}
.rankup h3{font-size:26px;margin-top:6px}
.review h3{font-size:22px}
.review ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.review li{border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--paper);display:grid;gap:2px}
.review li .q{font-weight:700;color:var(--muted);font-size:14px}
.review li .a{font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.review li .a .say{width:34px;height:34px;font-size:15px}
.actions{display:grid;gap:12px}

/* ---------- memory ---------- */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.mhead h2{font-size:30px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:480px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mcard{appearance:none;aspect-ratio:3/4;max-width:100%;perspective:700px;border:none;background:none;padding:0;cursor:pointer}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.mcard .f{background:var(--red);font-size:34px;background-image:radial-gradient(circle,rgba(0,0,0,.18) 1.3px,transparent 1.7px);background-size:10px 10px}
.mcard .b{background:var(--paper);transform:rotateY(180deg);font-weight:900;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.mcard .b.de{background:var(--gold-soft)}
.mcard.done .b{background:var(--good-bg);border-color:var(--good)}

/* ---------- confettis ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border:2px solid var(--ink);border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--rot))}}
/* ---------- comptes ---------- */
.logo-top{flex-wrap:wrap;row-gap:8px;column-gap:6px}
.logo-top .tag{white-space:nowrap;padding:3px 8px}
.logo-top .tr{display:flex;align-items:center;gap:6px;min-width:0;margin-left:auto}
.chip-acc{appearance:none;display:inline-flex;align-items:center;gap:5px;min-height:44px;max-width:11.5rem;border:3px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--ink);padding:4px 10px;font-weight:900;font-size:14px;cursor:pointer;color:var(--ink)}
.chip-acc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip-acc:active{transform:translateY(3px);box-shadow:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--gold-soft);border:3px solid var(--ink);border-radius:16px;padding:4px;margin-bottom:4px}

.guestbar h2,.merge h2{font-size:22px}
.guestbar p,.merge p{margin:6px 0 0;font-weight:700}
.notice{background:var(--good-bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice p{flex:1 1 14rem;margin:0;font-weight:800}
.notice .btn{font-size:16px;padding:6px 16px}
.acc-head{display:flex;align-items:center;gap:14px}
.acc-head .rank-emo{grid-row:auto}
.acc-help{margin-top:12px;border:2.5px dashed var(--ink);border-radius:14px;padding:10px 12px;background:var(--gold-soft);font-weight:700}

.acc-help .idline{margin-top:6px;font-size:18px;overflow-wrap:anywhere}

.danger p{font-weight:700;margin:6px 0 0}

@media (max-width:380px){.opts.two{grid-template-columns:1fr}.worlds{gap:10px}.wt .h{font-size:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function numWordDistractors(n){
  const t=Math.floor(n/10),u=n%10,right=de(n),c=[],fakes=[];
  const add=x=>{if(x&&x!==right&&!c.includes(x))c.push(x);};
  const uw=u===1?'ein':U[u];
  if(n>20&&u){
    const sw=u*10+t;if(sw>20&&sw%10&&sw!==n)add(de(sw));
    if(u===1)fakes.push('einsund'+TENS[t]);
    if(t===2)fakes.push(uw+'undzweizig');
    if(t===3)fakes.push(uw+'unddreizig');
    if(t===6)fakes.push(uw+'undsechszig');
    if(t===7)fakes.push(uw+'undsiebenzig');
    add(de(u<9?n+1:n-1));add(de(t<9?n+10:n-10));add(de(t>2?n-10:n+20));
  }else if(n>=13&&n<=19){
    if(n===16)fakes.push('sechszehn');if(n===17)fakes.push('siebenzehn');
    add(de(u*10));add(de(n===19?18:n+1));add(de(n===13?14:n-1));
  }else if(n>=20&&!u){
    const f={20:'zweizig',30:'dreizig',60:'sechszig',70:'siebenzig'}[n];if(f)fakes.push(f);
    add(de(10+t));add(de(n===90?80:n+10));add(de(n===20?30:n-10));
  }else{add(de((n+1)%13));add(de((n+2)%13));add(de((n+5)%13));}
  const out=[];if(fakes.length)out.push(pick(fakes));
  for(const x of shuffle(c)){if(out.length>=3)break;if(!out.includes(x))out.push(x);}
  while(out.length<3){const r=de(1+rnd(99));if(r!==right&&!out.includes(r))out.push(r);}
  return out;
}
function numDigitDistractors(n){
  const t=Math.floor(n/10),u=n%10,c=new Set();
  if(u&&t&&n>20)c.add(u*10+t);c.add(n+(u<9?1:-1));c.add(n+(t<9?10:-10));
  if(n>=13&&n<=19)c.add(u*10);if(n>=20&&!u)c.add(10+t);c.add(n>50?n-20:n+20);c.delete(n);
  const out=shuffle([...c].filter(x=>x>=0&&x<100)).slice(0,3);
  while(out.length<3){const r=1+rnd(99);if(r!==n&&!out.includes(r))out.push(r);}
  return out;
}

  if(q.tiles)q.tiles=shuffle(q.tiles);
  if(q.kind==='tf'&&!q.ask)q.ask='Vrai ou faux ?';
  return q;
}

function merge(base,o){
  if(!o||typeof o!=='object')return base;
  for(const k of Object.keys(base)){
    if(o[k]===undefined)continue;
    if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))base[k]=Object.assign({},base[k],o[k]);
    else base[k]=o[k];
  }
  return base;
}

function lsGet(k){try{return localStorage.getItem(k);}catch(e){storeOK=false;return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);storeOK=true;return true;}catch(e){storeOK=false;return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function readLocal(k){const raw=lsGet(k);if(!raw)return null;try{return merge(fresh(),JSON.parse(raw));}catch(e){return null;}}
let profile={type:'guest',uid:null,pseudo:''};
if(ACCOUNTS_ON){try{const o=JSON.parse(lsGet(LAST_KEY)||'null');if(o&&o.uid)profile={type:'account',uid:o.uid,pseudo:o.pseudo||''};}catch(e){}}
const curKey=()=>profile.type==='account'?accKey(profile.uid):KEY;

function writeLocal(){lsSet(curKey(),JSON.stringify(state));}
function save(){state.updatedAt=Date.now();state.rev=(state.rev||0)+1;writeLocal();Sync.later();}
const isDirty=()=>(state.rev||0)!==(state.syncedRev||0);
const SYNC_FIELDS=['rev','syncedRev','syncBase'];
const hasProgress=s=>!!s&&((s.xp||0)>0||Object.keys(s.ghosts||{}).length>0);
function combine(a,b){
  const o=merge(fresh(),JSON.parse(JSON.stringify(a)));
  o.xp=(a.xp||0)+(b.xp||0);
  for(const [w,n] of Object.entries(b.stars||{}))o.stars[w]=Math.max(o.stars[w]||0,n||0);
  for(const [id,g] of Object.entries(b.ghosts||{})){const c=o.ghosts[id];o.ghosts[id]=c?Object.assign({},c,{fails:Math.max(c.fails||1,g.fails||1),hp:Math.min(c.hp||2,g.hp||2)}):g;}
  o.best.blitz=Math.max(o.best.blitz||0,(b.best&&b.best.blitz)||0);
  const m=[o.best.memory,b.best&&b.best.memory].filter(x=>x>0);o.best.memory=m.length?Math.min(...m):0;
  for(const k of Object.keys(o.stats))o.stats[k]=(o.stats[k]||0)+((b.stats&&b.stats[k])||0);
  o.seenIntro=!!(a.seenIntro||b.seenIntro);
  return o;
}

function pseudoProblem(raw){

function authMsg(e){
  const c=String((e&&e.code)||'');
  if(c.includes('email-already-in-use'))return 'Cet identifiant est déjà pris. Choisis-en un autre.';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login-credentials|invalid-email|user-mismatch/.test(c))return 'Identifiant ou mot de passe incorrect.';
  if(c.includes('weak-password'))return 'Mot de passe trop court : au moins 6 caractères.';
  if(c.includes('password-does-not-meet-requirements'))return 'Ce mot de passe ne respecte pas les règles du site. Essaie-en un plus long.';
  if(c.includes('too-many-requests'))return 'Trop d\'essais. Attends quelques minutes, puis réessaie.';
  if(c.includes('network-request-failed'))return 'Pas de connexion internet ? Vérifie ta connexion, puis réessaie.';
  if(/operation-not-allowed|admin-restricted-operation/.test(c))return 'Les comptes ne sont pas encore activés dans Firebase (Authentication, méthode « E-mail/Mot de passe »).';
  if(/api-key-not-valid|invalid-api-key/.test(c))return 'La configuration Firebase est incorrecte : vérifie firebase-config.js.';
  if(c.includes('requires-recent-login'))return 'Déconnecte-toi, reconnecte-toi, puis recommence.';
  return 'Ça n\'a pas marché ('+(c||'erreur inconnue')+'). Réessaie.';
}
function fsMsg(e){
  const c=String((e&&e.code)||'');
  if(c==='permission-denied')return 'Firestore refuse l\'accès : vérifie les règles (étape 6 du guide).';
  if(c==='not-found')return 'La base Firestore n\'existe pas encore (étape 6 du guide).';
  if(c==='unavailable'||c==='deadline-exceeded')return 'Hors ligne : ta progression sera envoyée au retour d\'internet.';
  if(c==='unauthenticated')return 'Session expirée : reconnecte-toi.';
  return 'Sauvegarde en ligne impossible pour le moment ('+(c||'erreur')+').';
}
const Acc={
  on:ACCOUNTS_ON,ready:!ACCOUNTS_ON,A:null,F:null,auth:null,db:null,user:null,
  loadErr:'',pending:null,mergeOffer:false,notice:'',loading:null,
  async init(){
    if(!this.on)return;
    try{
      const base=`https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
      const [appM,A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore-lite.js')]);
      this.A=A;this.F=F;
      const app=appM.initializeApp(FB_CFG);
      this.auth=A.initializeAuth(app,{persistence:[A.indexedDBLocalPersistence,A.browserLocalPersistence]});
      this.db=F.getFirestore(app);
      const em=window.FIREBASE_EMULATORS;
      if(em){A.connectAuthEmulator(this.auth,em.auth,{disableWarnings:true});F.connectFirestoreEmulator(this.db,em.firestore[0],em.firestore[1]);}
      A.onAuthStateChanged(this.auth,u=>{onUser(u);});
    }catch(e){
      this.A=null;this.loadErr='Le système de comptes n\'a pas pu se charger. Vérifie ta connexion internet, puis recharge la page.';
      this.ready=true;refresh();
    }
  }
};
const Sync={
  timer:null,busy:false,again:false,lastOk:0,err:'',blocked:false,pulled:false,pulling:null,
  can(){return !this.blocked&&profile.type==='account'&&!!Acc.user&&Acc.user.uid===profile.uid&&!!Acc.db;},
  ref(){return Acc.F.doc(Acc.db,'joueurs',profile.uid);},
  reset(){clearTimeout(this.timer);this.pulled=false;this.pulling=null;this.lastOk=0;this.err='';this.again=false;},
  later(){if(!this.can())return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),2000);},
  async flush(){clearTimeout(this.timer);if(this.can())await this.run();},
  async run(){if(!this.pulled)return syncFromCloud();if(isDirty())return this.push();},
  async push(){
    // On n'envoie jamais avant d'avoir lu la version en ligne : sinon un nouvel appareil pourrait l'écraser.
    if(!this.can()||!this.pulled)return;
    if(this.busy){this.again=true;return;}
    this.busy=true;
    const uid=profile.uid,r0=state.rev||0,t=Date.now();
    const prog=JSON.parse(JSON.stringify(state));SYNC_FIELDS.forEach(k=>delete prog[k]);
    try{
      await Acc.F.setDoc(this.ref(),{pseudo:profile.pseudo||'',progress:prog,updatedAt:t});
      if(profile.uid===uid){state.syncedRev=Math.max(state.syncedRev||0,r0);state.syncBase=t;writeLocal();}
      this.lastOk=Date.now();this.err='';
    }catch(e){this.err=fsMsg(e);}
    this.busy=false;
    if(this.again){this.again=false;if(isDirty())await this.push();}
    renderSave();
  },
  async pull(){const snap=await Acc.F.getDoc(this.ref());return snap.exists()?snap.data():null;}
};
function syncFromCloud(){
  if(!Sync.can())return Promise.resolve();
  if(Sync.pulling)return Sync.pulling;
  Sync.pulling=(async()=>{
    const uid=profile.uid;
    try{
      const r=await Sync.pull();
      if(profile.uid!==uid)return;
      Sync.pulled=true;Sync.err='';Sync.lastOk=Date.now();
      if(!r||!r.progress){await Sync.push();return;}
      const Rt=r.updatedAt||0,local=state;
      const take=(x,dirty)=>{x.settings=Object.assign({},fresh().settings,local.settings);x.syncBase=Rt;x.rev=dirty?1:0;x.syncedRev=0;state=x;writeLocal();refresh();};
      if(!local.syncBase){
        // Premier contact de cet appareil avec ce compte : ce qui a été joué ici s'ajoute à la version en ligne.
        if(isDirty()&&hasProgress(local)){take(combine(merge(fresh(),r.progress),local),true);await Sync.push();}
        else take(merge(fresh(),r.progress),false);
      }else if(Rt===local.syncBase){if(isDirty())await Sync.push();}
      else if(!isDirty())take(merge(fresh(),r.progress),false);
      else if((local.xp||0)>=((r.progress&&r.progress.xp)||0)){local.syncBase=Rt;await Sync.push();}
      else take(merge(fresh(),r.progress),false);
    }catch(e){Sync.err=fsMsg(e);}
    finally{Sync.pulling=null;renderSave();}
  })();
  return Sync.pulling;
}
async function onUser(u){
  Acc.ready=true;
  if(u){
    const pend=Acc.pending;Acc.pending=null;
    Acc.user=u;Sync.blocked=false;
    const pseudo=(pend&&pend.display)||u.displayName||String(u.email||'').split('@')[0];
    if(!(profile.type==='account'&&profile.uid===u.uid)){
      const settings=state.settings;
      let next=readLocal(accKey(u.uid));
      Acc.notice='';
      if(pend&&pend.signup){
        const guest=readLocal(KEY);
        if(hasProgress(guest)){next=guest;lsDel(KEY);Acc.notice=`Identifiant créé ! Tes ${guest.xp} XP sont maintenant sauvegardés dans ton compte.`;}
        else Acc.notice='Identifiant créé ! Ta progression sera sauvegardée automatiquement.';
        next=next||fresh();next.syncBase=0;next.rev=(next.rev||0)+1;next.syncedRev=0;
      }
      state=next||fresh();state.settings=Object.assign({},fresh().settings,settings);
      profile={type:'account',uid:u.uid,pseudo};
      Sync.reset();
      writeLocal();
      Acc.mergeOffer=!(pend&&pend.signup)&&hasProgress(readLocal(KEY));
    }else if(pseudo)profile.pseudo=pseudo;
    lsSet(LAST_KEY,JSON.stringify({uid:u.uid,pseudo:profile.pseudo}));
    if(screen==='auth'){show('home');renderHome();}else refresh();
    await syncFromCloud();
  }else{
    Acc.user=null;
    if(profile.type==='account'){
      clearTimeout(Sync.timer);
      if(!isDirty()||Acc.wipe)lsDel(accKey(profile.uid));
      lsDel(LAST_KEY);
      const settings=state.settings;
      profile={type:'guest',uid:null,pseudo:''};
      state=readLocal(KEY)||fresh();state.settings=settings;
      Acc.mergeOffer=false;Sync.reset();
    }
    Sync.blocked=false;Acc.wipe=false;
    refresh();
  }
}

  if(screen==='home')renderHome();
  else if(screen==='account')renderAccount();
  else if(screen==='auth'){const el=$('#auth-load');if(el)el.textContent=Acc.loadErr;}

/* ---------- Construction d'une mission ---------- */
function poolFor(w){
  const ids=Object.keys(STATIC).filter(id=>STATIC[id].world===w);
  if(w==='pr'&&Voice.ok)ids.push(...sample(LW,4).map(x=>'pr.listen.'+x));
  return ids;
}
function pickWorld(w,n,exclude){
  const ok=id=>!exclude.includes(id);
  if(w==='num'){
    const trap=shuffle([16,17,20,21,30,60,70,52,48,99,31,66,77,71,13,19]);
    const rn=()=>{const r=Math.random();if(r<.2)return 13+rnd(7);if(r<.4)return(2+rnd(8))*10;return 21+rnd(79);};
    const comp=()=>{let x;do{x=21+rnd(79);}while(x%10===0);return x;};
    const st=shuffle(Object.keys(STATIC).filter(id=>STATIC[id].world==='num'));
    const ids=[`num.d2w.${trap[0]}`,`num.w2d.${rn()}`,`num.d2w.${rn()}`,`num.type.${trap[1]}`,`num.dig.${comp()}`,`num.build.${comp()}`,`num.w2d.${trap[2]}`,Voice.ok?`num.listen.${rn()}`:`num.d2w.${trap[3]}`,st[0],st[1],st[2]];
    return shuffle([...new Set(ids)].filter(ok)).slice(0,n);
  }
  if(w==='fam'){
    const words=shuffle(FAM.map(f=>f.k));
    const gen=['fr2de','de2fr','gen','fr2de','de2fr','type','gen'].map((k,i)=>`fam.${k}.${words[i]}`);
    const st=shuffle(Object.keys(STATIC).filter(id=>STATIC[id].world==='fam')).slice(0,4);
    return shuffle([...gen,...st].filter(ok)).slice(0,n);
  }
  const capK={tf:2,build:2,type:2,listen:3},cnt={},out=[];
  for(const id of shuffle(poolFor(w)).filter(ok)){const k=kindOf(id);if(capK[k]&&(cnt[k]||0)>=capK[k])continue;cnt[k]=(cnt[k]||0)+1;out.push(id);if(out.length>=n)break;}
  return out;
}
function toItems(ids){
  const out=[];
  for(const id of ids){const q=getQ(id);if(q)out.push({id,q});else if(state.ghosts[id]){delete state.ghosts[id];}}
  return out;
}

/* ---------- Réponse ---------- */
function norm(s){return String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?¿¡;:«»"()]/g,' ').replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/\s+/g,' ').trim();}
const noUml=s=>norm(s).replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
function checkTyped(given,q){
  const g=norm(given);if(!g)return{ok:false,empty:true};
  for(const a of q.accept){if(norm(a)===g){const clean=x=>String(x).trim().replace(/[.!?]+$/,'').replace(/\s+/g,' ');return{ok:true,exact:clean(given)===clean(a)};}}
  for(const a of q.accept){if(noUml(a)===noUml(given))return{ok:false,near:'uml'};}
  for(const a of q.accept){const m=String(a).match(/^(der|die) (.+)$/);if(m&&norm(m[2])===g)return{ok:false,near:'art'};}
  return{ok:false};
}
function onAnswer(ok,info={}){
  if(run.answered)return;run.answered=true;
  const it=run.queue[run.i],q=it.q,id=it.id;
  it.res=ok;
  if(!it.reask)run.first[id]=ok;
  state.stats.answered++;if(ok)state.stats.correct++;
  let gain=0,ghostLine='',extra='';
  const had=state.ghosts[id];
  if(ok){
    run.combo++;run.maxCombo=Math.max(run.maxCombo,run.combo);
    gain=10+Math.min(10,2*(run.combo-1));
    if(had){
      had.hp=(had.hp||2)-1;
      if(had.hp<=0){delete state.ghosts[id];run.slain++;state.stats.slain++;gain+=15;ghostLine='💥 Fantôme vaincu ! +15 XP';Sfx.play('ghost');confetti(30);}
      else ghostLine='👻 Touché ! Encore une bonne réponse, dans une prochaine mission, et il disparaît.';
    }
    if([3,5,8,10,15].includes(run.combo)){extra=run.combo>=8?`🔥 Combo x${run.combo} : Unglaublich ! (= incroyable)`:`🔥 Combo x${run.combo} !`;Sfx.play('combo');}
    else if(!ghostLine)Sfx.play('good');
  }else{
    run.combo=0;
    state.ghosts[id]={hp:2,fails:((had&&had.fails)||0)+1,world:q.world,t:Date.now()};

  if(rNow>run.rank0){extra=(extra?extra+'<br>':'')+`🎉 Nouveau rang : ${esc(RANKS[rNow].de)} ${RANKS[rNow].emo} (= ${esc(RANKS[rNow].fr)})`;run.rank0=rNow;run.rankUp=rNow;Sfx.play('rank');confetti();}

/* ---------- Fin de mission ---------- */
function finish(){
  const vals=Object.values(run.first);const good=vals.filter(Boolean).length,total=vals.length;
  const pct=total?good/total:0;
  const stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  let bonus=0;
  if(run.mode!=='blitz'&&total>=5){bonus+=20;if(stars===3)bonus+=20;}
  run.xp+=bonus;state.xp+=bonus;
  if(run.mode==='world')state.stars[run.world]=Math.max(state.stars[run.world]||0,stars);
  state.stats.rounds++;
  const rNow=rankIdx(state.xp);if(rNow>run.rank0){run.rankUp=rNow;run.rank0=rNow;}
  save();Sync.flush();
  renderResult({good,total,stars,pct,bonus});
}
function verdict(pct){
  if(pct>=1)return['Perfekt !','parfait','Même Kurt, 52 ans d\'expérience, n\'a jamais vu ça.'];
  if(pct>=.8)return['Sehr gut !','très bien','Tu parles presque comme Sandra.'];
  if(pct>=.6)return['Gut !','bien','Pas mal du tout. Les fantômes attendent leur revanche.'];
  if(pct>=.4)return['Na ja…','bof, bof','Ça rentre ! Chasse tes fantômes pour progresser.'];
  return['Kopf hoch !','garde la tête haute','L\'allemand s\'apprend en se trompant. Tes fantômes vont t\'aider.'];
}

      <p style="margin:6px 0 0;font-weight:700">${run.newGhosts?`${run.newGhosts} nouveau${run.newGhosts>1?'x':''} fantôme${run.newGhosts>1?'s':''}. `:'Aucun nouveau fantôme. '}${run.slain?`${run.slain} vaincu${run.slain>1?'s':''} ! `:''}Il en reste ${gh} à chasser.</p></section>

/* ---------- Blitz ---------- */
function blitzPool(){
  const st=Object.keys(STATIC).filter(id=>['mcq','tf'].includes(STATIC[id].kind));
  return st;
}
function blitzNextId(){
  const r=Math.random();let id;
  if(r<.45)id=pick(blitzPool());
  else if(r<.7)id=`fam.${pick(['fr2de','de2fr','gen'])}.${pick(FAM).k}`;
  else{const n=pick([16,17,20,21,30,60,70,52,48,99,13+rnd(7),(2+rnd(8))*10,21+rnd(79),21+rnd(79)]);id=`num.${pick(['d2w','w2d'])}.${n}`;}
  if(run.recent.includes(id))return blitzNextId();
  run.recent.push(id);if(run.recent.length>10)run.recent.shift();
  return id;
}
function startBlitz(){
  run=newRun('blitz',null,[]);run.recent=[];run.score=0;run.end=Date.now()+60000;
  show('play');blitzNext();
  run.timer=setInterval(()=>{
    const left=Math.max(0,Math.ceil((run.end-Date.now())/1000));const t=$('#timer');if(t)t.textContent=left;
    if(left<=0){clearInterval(run.timer);run.timer=null;blitzEnd();}
  },200);
}
function blitzNext(){
  if(!run||run.mode!=='blitz')return;
  const id=blitzNextId();const q=getQ(id);
  run.queue=[{id,q}];run.i=0;renderQ();
  const t=$('#timer');if(t)t.textContent=Math.max(0,Math.ceil((run.end-Date.now())/1000));
  const b=$('#bscore');if(b)b.textContent='⚡ '+run.score;
}
function blitzAfter(ok,q){
  if(ok)run.score++;
  const b=$('#bscore');if(b)b.textContent='⚡ '+run.score;
  const cb=$('#combo');if(cb){cb.hidden=run.combo<2;cb.textContent=`🔥 x${run.combo}`;}
  const f=$('#flash');
  if(f)f.innerHTML=ok?`<div class="flash good">✅ ${pick(CHEERS)[0]}</div>`:`<div class="flash bad">❌ C'était : <b>${q.kind==='tf'?answerText(q):(q.optLang==='num'?esc(answerText(q)):fmtDe(answerText(q)))}</b></div>`;

}
function blitzEnd(){

      <p class="bigstars" style="font-family:var(--f-display);color:var(--paper);text-shadow:var(--outline)">⚡ ${run.score}</p>

    ${run.rankUp!=null?`<section class="panel rankup"><span class="emo">${RANKS[run.rankUp].emo}</span><h3>Nouveau rang : ${esc(RANKS[run.rankUp].de)} !</h3></section>`:''}

const PAIRS=[['der Vater','le père'],['die Mutter','la mère'],['die Eltern','les parents'],['der Sohn','le fils'],['die Tochter','la fille'],['der Bruder','le frère'],['die Schwester','la sœur'],['die Kinder','les enfants'],['der Großvater','le grand-père'],['die Großmutter','la grand-mère'],['die Großeltern','les grands-parents'],['krank','malade'],['müde','fatigué(e)'],['gestresst','stressé(e)'],['Warum?','Pourquoi ?'],['verliebt','amoureux'],['zwanzig','20'],['dreißig','30'],['sechzehn','16'],['siebzig','70'],['zweiundfünfzig','52'],['achtundvierzig','48']];
let mem=null;
function startMemory(){
  const pairs=sample(PAIRS,6);
  const cards=shuffle(pairs.flatMap((p,i)=>[{p:i,t:p[0],de:true},{p:i,t:p[1],de:false}]));
  mem={cards,open:[],done:new Set(),moves:0,lock:false,pairs};
  show('memory');renderMemory();
}
function renderMemory(){
  SCR.memory.innerHTML=`<div class="topbar"><button class="icon-btn" data-act="home" aria-label="Retour au QG">✕</button><span class="pill" id="mmoves">Coups : ${mem.moves}</span><span class="pill">Paires : <span id="mpairs">${mem.done.size}</span>/6</span></div>
  <div class="mhead"><h2>Memory <span class="emo">🃏</span></h2><p style="margin:0;font-weight:700">Retourne deux cartes : allemand + français qui vont ensemble.</p></div>
  <div class="mgrid">${mem.cards.map((c,i)=>`<button class="mcard" data-act="mem" data-i="${i}" aria-label="Carte ${i+1}"><span class="in"><span class="f"><span class="emo">🥨</span></span><span class="b ${c.de?'de':''}">${c.de?fmtDe(c.t):nb(esc(c.t))}</span></span></button>`).join('')}</div>`;
}
function memFlip(i){
  if(mem.lock)return;const c=mem.cards[i];const el=$$('.mcard')[i];
  if(mem.done.has(c.p)||mem.open.includes(i))return;
  el.classList.add('up');el.setAttribute('aria-label',c.t);mem.open.push(i);
  if(c.de)Voice.say(c.t);
  if(mem.open.length===2){
    mem.moves++;$('#mmoves').textContent='Coups : '+mem.moves;
    const [a,b]=mem.open;
    if(mem.cards[a].p===mem.cards[b].p){
      mem.done.add(c.p);mem.open=[];Sfx.play('good');
      [a,b].forEach(k=>$$('.mcard')[k].classList.add('done'));
      $('#mpairs').textContent=mem.done.size;
      if(mem.done.size===6)setTimeout(memEnd,500);
    }else{
      mem.lock=true;
      setTimeout(()=>{[a,b].forEach(k=>{const e=$$('.mcard')[k];if(e){e.classList.remove('up');e.setAttribute('aria-label','Carte '+(k+1));}});mem.open=[];mem.lock=false;},950);
    }
  }
}
function memEnd(){
  const best=state.best.memory||0;const rec=!best||mem.moves<best;if(rec)state.best.memory=mem.moves;
  const r0=rankIdx(state.xp);state.xp+=30;const r1=rankIdx(state.xp);save();Sync.flush();
  Sfx.play(r1>r0?'rank':'ghost');confetti();
  SCR.result.innerHTML=`<div class="res"><div class="res-hero"><h2>Geschafft !</h2><p class="tr">(= réussi)</p><p class="quip">6 paires en ${mem.moves} coups. ${rec?'🏆 Nouveau record !':`Record : ${best} coups.`}</p></div>
    <section class="panel review"><h3>Les paires de cette partie</h3><ul>${mem.pairs.map(p=>`<li><span class="a">${fmtDe(p[0])} = ${nb(esc(p[1]))} ${sayBtn(p[0])}</span></li>`).join('')}</ul></section>
    ${r1>r0?`<section class="panel rankup"><span class="emo">${RANKS[r1].emo}</span><h3>Nouveau rang : ${esc(RANKS[r1].de)} !</h3></section>`:''}
    <div class="actions"><button class="btn full" data-act="memory">Rejouer (+30 XP)</button><button class="btn white full" data-act="home">Retour au QG</button></div></div>`;
  show('result');
}

  if(run.answered)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4){const b=$$('#opts .opt')[n-1];if(b)b.click();}
});

/* =========================================================
   Démarrage
   ========================================================= */
function boot(){
  Voice.init();
  if(Acc.on&&profile.type!=='account'&&!lsGet(GUEST_KEY))openAuth('signup','welcome');
  else{show('home');renderHome();}
  Acc.loading=Acc.init();
}
boot();
</script>
