    rows.push(`<button class="mstop ${st} ${boss?'boss':''} ${x<50?'left':'right'}" data-act="mapgo" data-i="${i}" style="top:${y}px;--x:${x}%">
      <span class="pin"><span class="emo">${m.st.emo}</span>${st==='lock'?'<span class="lk emo">🔒</span>':''}${m.done&&m.open?'<span class="ok">✓</span>':''}${st==='cur'?`<span class="me">${avatarHtml('mini')}</span>`:''}</span>
      <span class="mlab"><b>${esc(m.st.city)}</b><span>${nb(esc(stopName(m.st)))}</span>${stars}${st==='cur'?'<span class="go">C\'est ici ! Joue →</span>':''}</span></button>`);
    pts.push([x,y]);y+=boss?132:116;
  });
  const H=y+30;
  const curve=a=>a.map((p,k)=>k?`C ${a[k-1][0]} ${a[k-1][1]+56} ${p[0]} ${p[1]-56} ${p[0]} ${p[1]}`:`M ${p[0]} ${p[1]}`).join(' ');
  const upto=cur?cur.i:ms.length-1;
  SCR.map.innerHTML=`<div class="topbar"><button class="icon-btn" data-act="home" aria-label="Retour au QG">✕</button><h2 style="font-size:24px">Carte d'aventure</h2><span class="coins" style="margin-left:auto">🥨 ${coins()}</span></div>
  <section class="panel maphead">${avatarHtml('big')}<div>
    <h3>${cur?`Prochaine étape : ${esc(cur.st.city)} ${cur.st.emo}`:'Tu as fini le voyage ! 🎉'}</h3>
    <p>${cur?esc(cur.st.fact):'Bravo ! La suite du voyage arrive avec tes prochains cours.'}</p>
    <div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="${ms.length}" aria-valuenow="${doneN}" aria-label="Étapes réussies"><i style="width:${Math.round(100*doneN/ms.length)}%"></i></div>
    <p class="msmall">${doneN} / ${ms.length} étapes. Réussis une mission (au moins 1 étoile) pour avancer : +${MAP_BONUS} 🥨 par nouvelle ville.</p></div></section>
  <div class="mapbox" style="height:${H}px">
    <svg class="mpath" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${curve(pts)}" class="todo"/>
      ${upto>0?`<path d="${curve(pts.slice(0,upto+1))}" class="done"/>`:''}
    </svg>
    ${rows.join('')}
    <div class="mend" style="top:${H-34}px">🚧 La suite du voyage arrive avec tes prochains cours !</div>
  </div>`;
}
function openMap(){
  show('map');renderMap();
  const c=$('.mstop.cur');if(c)setTimeout(()=>{try{c.scrollIntoView({block:'center'});}catch(e){}},60);
}
function mapGo(i){
  const m=mapStatus()[i];if(!m)return;
  if(!m.open){const prev=MAP_STOPS[i-1];toast(`🔒 Pour aller à ${esc(m.st.city)}, réussis d'abord ${prev?`l'étape ${esc(prev.city)}`:'l\'étape d\'avant'} !`);Sfx.play('bad');return;}
  if(m.st.boss)startBoss(m.st.boss);else startWorld(m.st.w);
  if(run)run.fromMap=true;
}

/* ---------- Blitz ---------- */
function blitzPool(){
  const st=Object.keys(STATIC).filter(id=>['mcq','tf'].includes(STATIC[id].kind));
  return st;
}
function blitzNextId(){
  const r=Math.random();let id;
  if(r<.45)id=pick(blitzPool());
  else if(r<.6)id=`fam.${pick(['fr2de','de2fr','gen'])}.${pick(FAM).k}`;
  else if(r<.75)id=`hobby.${pick(['emo','fr2de','de2fr'])}.${pick(HOB).k}`;
  else if(r<.83)id=`plur.f.${pick(PLV).inf}.${pick(['wir','siepl'])}`;
  else if(r<.9)id=`patch.${pick(['fr2de','de2fr','gen'])}.${pick(PATCH).k}`;
  else{const n=pick([16,17,20,21,30,60,70,52,48,99,13+rnd(7),(2+rnd(8))*10,21+rnd(79),21+rnd(79)]);id=`num.${pick(['d2w','w2d'])}.${n}`;}
  if(run.recent.includes(id))return blitzNextId();
  run.recent.push(id);if(run.recent.length>10)run.recent.shift();
  return id;
}
function startBlitz(){
  run=newRun('blitz',null,[]);run.recent=[];run.score=0;run.end=Date.now()+60000;
  show('play');blitzNext();
  run.timer=setInterval(()=>{
    const left=Math.max(0,Math.ceil((run.end-Date.now())/1000));const t=$('#timer');if(t)t.textContent=left;
    if(left<=0){clearInterval(run.timer);run.timer=null;blitzEnd();}
  },200);
}
function blitzNext(){
  if(!run||run.mode!=='blitz')return;
  const id=blitzNextId();const q=getQ(id);
  run.queue=[{id,q}];run.i=0;renderQ();
  const t=$('#timer');if(t)t.textContent=Math.max(0,Math.ceil((run.end-Date.now())/1000));
  const b=$('#bscore');if(b)b.textContent='⚡ '+run.score;
}
function blitzAfter(ok,q){
  if(ok)run.score++;
  const b=$('#bscore');if(b)b.textContent='⚡ '+run.score;
  const cb=$('#combo');if(cb){cb.hidden=run.combo<2;cb.textContent=`🔥 x${run.combo}`;}
  const f=$('#flash');
  if(f)f.innerHTML=ok?`<div class="flash good">✅ ${pick(CHEERS)[0]}</div>`:`<div class="flash bad">❌ C'était : <b>${q.kind==='tf'?answerText(q):(q.optLang==='num'?esc(answerText(q)):fmtDe(answerText(q)))}</b></div>`;
  setTimeout(()=>{if(run&&run.mode==='blitz'&&run.timer)blitzNext();},ok?450:1300);
}
function blitzEnd(){
  if(!run||run.mode!=='blitz')return;
  const best=state.best.blitz||0;const rec=run.score>best;if(rec)state.best.blitz=run.score;
  const bonus=run.score*5;run.xp+=bonus;state.xp+=bonus;state.stats.rounds++;
  const rNow=rankIdx(state.xp);if(rNow>run.rank0){run.rankUp=rNow;}
  run.newBadges=checkBadges();
  save();Sync.flush();
  const gh=dueGhostIds().length;
  SCR.result.innerHTML=`<div class="res">
    <div class="res-hero"><h2>${run.score>=15?'Blitzschnell !':'Zeit ist um !'}</h2><p class="tr">(= ${run.score>=15?'rapide comme l\'éclair':'le temps est écoulé'})</p>
      <p class="bigstars" style="font-family:var(--f-display);color:var(--paper);text-shadow:var(--outline)">⚡ ${run.score}</p>
      <p class="quip">${rec?'🏆 Nouveau record !':`Record à battre : ${best}`}</p></div>
    <div class="stats"><div class="stat"><b>${run.score}</b><span>bonnes réponses</span></div><div class="stat"><b>+${run.xp}</b><span>XP gagnés</span></div><div class="stat"><b>x${run.maxCombo}</b><span>meilleur combo</span></div></div>
    ${run.rankUp!=null?`<section class="panel rankup"><span class="emo">${RANKS[run.rankUp].emo}</span><h3>Nouveau rang : ${esc(RANKS[run.rankUp].de)} !</h3></section>`:''}
    ${coinLine(coins()-run.coins0)}
    ${newBadgesHtml(run.newBadges)}
    <div class="actions">
      <button class="btn full" data-act="blitz">Rejouer le Blitz</button>
      ${gh?`<button class="btn dark full" data-act="ghosts">Chasser les fantômes (${gh}) <span class="emo">👻</span></button>`:''}
      <button class="btn white full" data-act="home">Retour au QG</button></div></div>`;
  show('result');if(rec||run.rankUp!=null)confetti();
}

/* ---------- Memory ---------- */
const PAIRS=[['der Vater','le père'],['die Mutter','la mère'],['die Eltern','les parents'],['der Sohn','le fils'],['die Tochter','la fille'],['der Bruder','le frère'],['die Schwester','la sœur'],['die Kinder','les enfants'],['der Großvater','le grand-père'],['die Großmutter','la grand-mère'],['die Großeltern','les grands-parents'],['krank','malade'],['müde','fatigué(e)'],['gestresst','stressé(e)'],['Warum?','Pourquoi ?'],['verliebt','amoureux'],['zwanzig','20'],['dreißig','30'],['sechzehn','16'],['siebzig','70'],['zweiundfünfzig','52'],['achtundvierzig','48']].concat(PAIRS2,PAIRS3,PAIRS4);
let mem=null;
function startMemory(){
  const pairs=sample(PAIRS,6);
  const cards=shuffle(pairs.flatMap((p,i)=>[{p:i,t:p[0],de:true},{p:i,t:p[1],de:false}]));
  mem={cards,open:[],done:new Set(),moves:0,lock:false,pairs};
  show('memory');renderMemory();
}
function renderMemory(){
  SCR.memory.innerHTML=`<div class="topbar"><button class="icon-btn" data-act="home" aria-label="Retour au QG">✕</button><span class="pill" id="mmoves">Coups : ${mem.moves}</span><span class="pill">Paires : <span id="mpairs">${mem.done.size}</span>/6</span></div>
  <div class="mhead"><h2>Memory <span class="emo">🃏</span></h2><p style="margin:0;font-weight:700">Retourne deux cartes : allemand + français qui vont ensemble.</p></div>
  <div class="mgrid">${mem.cards.map((c,i)=>`<button class="mcard" data-act="mem" data-i="${i}" aria-label="Carte ${i+1}"><span class="in"><span class="f"><span class="emo">🥨</span></span><span class="b ${c.de?'de':''}">${c.de?fmtDe(c.t):nb(esc(c.t))}</span></span></button>`).join('')}</div>`;
}
function memFlip(i){
  if(mem.lock)return;const c=mem.cards[i];const el=$$('.mcard')[i];
  if(mem.done.has(c.p)||mem.open.includes(i))return;
  el.classList.add('up');el.setAttribute('aria-label',c.t);mem.open.push(i);
  if(c.de)Voice.say(c.t);
  if(mem.open.length===2){
    mem.moves++;$('#mmoves').textContent='Coups : '+mem.moves;
    const [a,b]=mem.open;
    if(mem.cards[a].p===mem.cards[b].p){
      mem.done.add(c.p);mem.open=[];Sfx.play('good');
      [a,b].forEach(k=>$$('.mcard')[k].classList.add('done'));
      $('#mpairs').textContent=mem.done.size;
      if(mem.done.size===6)setTimeout(memEnd,500);
    }else{
      mem.lock=true;
      setTimeout(()=>{[a,b].forEach(k=>{const e=$$('.mcard')[k];if(e){e.classList.remove('up');e.setAttribute('aria-label','Carte '+(k+1));}});mem.open=[];mem.lock=false;},950);
    }
  }
}
function memEnd(){
  const best=state.best.memory||0;const rec=!best||mem.moves<best;if(rec)state.best.memory=mem.moves;
  const c0=coins(),r0=rankIdx(state.xp);state.xp+=30;const r1=rankIdx(state.xp);const newB=checkBadges();save();Sync.flush();
  Sfx.play(r1>r0?'rank':'ghost');confetti();
  SCR.result.innerHTML=`<div class="res"><div class="res-hero"><h2>Geschafft !</h2><p class="tr">(= réussi)</p><p class="quip">6 paires en ${mem.moves} coups. ${rec?'🏆 Nouveau record !':`Record : ${best} coups.`}</p></div>
    <section class="panel review"><h3>Les paires de cette partie</h3><ul>${mem.pairs.map(p=>`<li><span class="a">${fmtDe(p[0])} = ${nb(esc(p[1]))} ${sayBtn(p[0])}</span></li>`).join('')}</ul></section>
    ${r1>r0?`<section class="panel rankup"><span class="emo">${RANKS[r1].emo}</span><h3>Nouveau rang : ${esc(RANKS[r1].de)} !</h3></section>`:''}
    ${coinLine(coins()-c0)}
    ${newBadgesHtml(newB)}
    <div class="actions"><button class="btn full" data-act="memory">Rejouer (+30 XP)</button><button class="btn white full" data-act="home">Retour au QG</button></div></div>`;
  show('result');
}

/* =========================================================
   Événements
   ========================================================= */
function quitNow(){if(run&&run.timer){clearInterval(run.timer);run.timer=null;}run=null;Sync.flush();show('home');renderHome();}
const ACT={
  'intro-ok'(){state.seenIntro=true;state.news=NEWS_ID;save();renderHome();},
  sound(){state.settings.sound=!state.settings.sound;save();renderHome();if(state.settings.sound)Sfx.play('good');},
  voice(){state.settings.voice=!state.settings.voice;save();renderHome();if(state.settings.voice)Voice.say('Hallo! Wie geht es Ihnen?');},
  reset(){resetAsk=true;renderHome();},
  'reset-no'(){resetAsk=false;renderHome();},
  'reset-yes'(){resetAsk=false;const s=state.settings;state=fresh();state.settings=s;state.seenIntro=true;state.news=NEWS_ID;save();Sync.flush();renderHome();},
  world(a){startWorld(a.dataset.w);},
  ghosts(){startGhosts();},
  blitz(){startBlitz();},
  memory(){startMemory();},
  daily(){startDaily();},
  boss(a){startBoss(a.dataset.b);},
  'news-ok'(){closeNews();},
  map(){openMap();},
  shop(){show('shop');renderShop();},
  mapgo(a){mapGo(+a.dataset.i);},
  shopitem(a){shopItem(a.dataset.id);},
  home(){quitNow();},
  quit(){
    const box=$('#quitbox');if(!box||(run&&run.mode==='blitz'))return quitNow();
    if(box.innerHTML){box.innerHTML='';return;}
    box.innerHTML=`<div class="quitask">Quitter la mission ? Tes fantômes sont déjà enregistrés. <button class="btn" data-act="home">Quitter</button><button class="btn white" data-act="quit-no">Continuer à jouer</button></div>`;
  },
  'quit-no'(){const box=$('#quitbox');if(box)box.innerHTML='';},
  say(a){Voice.say(a.dataset.say);},
  listen(){const q=run&&run.queue[run.i]&&run.queue[run.i].q;if(q)Voice.say(q.listen,false,true);},
  'listen-slow'(){const q=run&&run.queue[run.i]&&run.queue[run.i].q;if(q)Voice.say(q.listen,true,true);},
  opt(a){
    if(!run||run.answered)return;const q=run.queue[run.i].q;const i=+a.dataset.i;
    const ci=q.opts.findIndex(o=>String(o)===String(q.answer));
    markOpts(ci,i);onAnswer(i===ci);
  },
  tf(a){
    if(!run||run.answered)return;const q=run.queue[run.i].q;const v=a.dataset.v==='1';
    markOpts(q.answer?0:1,v?0:1);onAnswer(v===q.answer);
  },
  key(a){const inp=$('#ans');if(!inp)return;const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??inp.value.length;inp.value=inp.value.slice(0,s)+a.dataset.c+inp.value.slice(e);inp.focus();try{inp.setSelectionRange(s+1,s+1);}catch(err){}},
  tile(a){
    if(!run||run.answered)return;const i=+a.dataset.i;const q=run.queue[run.i].q;
    const inLine=a.closest('#line');
    if(inLine){run.pick=run.pick.filter(x=>x!==i);}
    else{if(run.pick.includes(i))return;run.pick.push(i);}
    const line=$('#line');line.innerHTML=run.pick.map(k=>`<button class="tile" data-act="tile" data-i="${k}">${fmt(q.tiles[k],'de')}</button>`).join('');
    $$('#bank .tile').forEach(b=>b.classList.toggle('used',run.pick.includes(+b.dataset.i)));
    const words=run.pick.map(k=>q.tiles[k]);
    $('#preview').textContent=words.length?(q.joiner===''?`${words.join(' + ')} → ${words.join('')}`:words.join(' ')):'';
    $('#go').disabled=!words.length;
  },
  'build-go'(){
    if(!run||run.answered)return;const q=run.queue[run.i].q;
    const words=run.pick.map(k=>q.tiles[k]);const ok=words.join('|')===q.target.join('|');
    $('#line').style.borderStyle='solid';$('#line').style.background=ok?'var(--good-bg)':'var(--bad-bg)';
    $$('#bank .tile, #line .tile').forEach(b=>b.disabled=true);$('#go').disabled=true;
    onAnswer(ok,{given:ok?'':words.join(q.joiner===''?'':' ')});
  },
  cont(){cont();},
  mem(a){memFlip(+a.dataset.i);},
  login(){openAuth('login',screen==='home'?'home':'welcome');},
  signup(){openAuth('signup',screen==='home'?'home':'welcome');},
  'mode-login'(){authMode='login';renderAuth();},
  'mode-signup'(){authMode='signup';renderAuth();},
  eye(a){const i=document.getElementById(a.dataset.for);if(!i)return;const vis=i.type==='password';i.type=vis?'text':'password';a.setAttribute('aria-pressed',String(vis));a.setAttribute('aria-label',vis?'Masquer le mot de passe':'Afficher le mot de passe');},
  guest(){lsSet(GUEST_KEY,'1');Acc.notice='';show('home');renderHome();},
  account(){delOpen=false;show('account');renderAccount();},
  logout(){logout();},
  'delete-ask'(){delOpen=true;renderAccount();try{$('#f-delpass').focus();}catch(e){}},
  'delete-no'(){delOpen=false;renderAccount();},
  'merge-yes'(){const g=readLocal(KEY);if(hasProgress(g)){state=combine(state,g);lsDel(KEY);save();Sync.flush();Acc.notice=`+${g.xp} XP ajoutés à ton compte !`;}Acc.mergeOffer=false;renderHome();},
  'merge-no'(){Acc.mergeOffer=false;renderHome();},
  'notice-ok'(){Acc.notice='';renderHome();}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e);}});
document.addEventListener('submit',e=>{
  if(e.target.id==='authform'){e.preventDefault();submitAuth();return;}
  if(e.target.id==='delform'){e.preventDefault();submitDelete();return;}
  if(e.target.id!=='typer')return;e.preventDefault();
  if(!run||run.answered)return;const q=run.queue[run.i].q;const inp=$('#ans');const given=inp.value;
  const r=checkTyped(given,q);
  if(r.empty){inp.focus();return;}
  inp.classList.add(r.ok?'ok':'ko');inp.readOnly=true;$('#go').disabled=true;$$('.key').forEach(k=>k.disabled=true);
  onAnswer(r.ok,{exact:r.ok?r.exact:undefined,near:r.near,given:r.ok?'':given});
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='f-pseudo'){authDraft=e.target.value;updatePseudoHint();}});
document.addEventListener('keydown',e=>{
  if(screen!=='play'||!run)return;
  const sheet=$('#sheet');
  if(!sheet.hidden&&(e.key==='Enter'||e.key===' ')){if(document.activeElement&&document.activeElement.id==='cont')return;e.preventDefault();cont();return;}
  if(e.target&&e.target.tagName==='INPUT')return;
  if(run.answered)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4){const b=$$('#opts .opt')[n-1];if(b)b.click();}
});

/* =========================================================
   Démarrage
   ========================================================= */
function boot(){
  Voice.init();
  if(Acc.on&&profile.type!=='account'&&!lsGet(GUEST_KEY))openAuth('signup','welcome');
  else{show('home');renderHome();}
  Acc.loading=Acc.init();
}
boot();
</script>
