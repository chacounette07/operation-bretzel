<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bretzel Admin – Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%A8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --face:#D4D0C8;--face-hi:#ECEAE4;--light:#FFFFFF;--shadow:#808080;--dark:#404040;
  --sel:#0A246A;--sel-t:#FFFFFF;--desk:#3A6EA5;--tip:#FFFFE1;--red:#A40000;--green:#006B2E;--link:#0000CC;
  --t1:#0A246A;--t2:#A6CAF0;--ti1:#808080;--ti2:#C0C0C0;--zebra:#F3F6FB;--hover:#DCE6F5;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:#000;font:12px Tahoma,"MS Sans Serif","Segoe UI",Verdana,Geneva,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:default}
.raised{border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);box-shadow:inset -1px -1px var(--shadow),inset 1px 1px var(--face-hi)}
.sunken{border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);box-shadow:inset 1px 1px var(--dark),inset -1px -1px var(--face-hi)}
.emo{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
[hidden]{display:none!important}

/* ---------- fenêtres ---------- */
.win{position:fixed;inset:6px 6px 36px;display:flex;flex-direction:column;background:var(--face);padding:3px;min-width:0}
.win.max{inset:0 0 30px}
.titlebar{display:flex;align-items:center;gap:6px;height:22px;flex:none;padding:0 2px 0 4px;background:linear-gradient(90deg,var(--t1),var(--t2));color:#fff;font-weight:bold;user-select:none}
.titlebar.off{background:linear-gradient(90deg,var(--ti1),var(--ti2))}
.titlebar .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .tico{font-size:14px;line-height:1}
.tbtn{width:18px;height:16px;padding:0;display:grid;place-items:center;font:bold 10px/1 Tahoma,sans-serif;background:var(--face);color:#000;margin-left:2px}
.tbtn:active{border-color:var(--shadow) var(--light) var(--light) var(--shadow)}

/* ---------- menus ---------- */
.menubar{display:flex;flex-wrap:wrap;padding:1px 0 2px;flex:none;position:relative;user-select:none}
.menubar>.m{position:relative}
.menubar>.m>button{background:none;border:1px solid transparent;padding:2px 8px}
.menubar>.m>button:hover{border-color:var(--light) var(--shadow) var(--shadow) var(--light)}
.menubar>.m.open>button{border-color:var(--shadow) var(--light) var(--light) var(--shadow)}
.menu{position:absolute;left:0;top:100%;z-index:60;min-width:250px;background:var(--face);padding:2px;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.menu button{display:flex;width:100%;justify-content:space-between;gap:24px;background:none;border:0;padding:4px 18px 4px 22px;text-align:left;white-space:nowrap}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--sel);color:var(--sel-t);outline:none}
.menu button:disabled{color:var(--shadow);text-shadow:1px 1px var(--light)}
.menu .k{opacity:.8}
.menu hr{border:0;border-top:1px solid var(--shadow);border-bottom:1px solid var(--light);margin:3px 2px}
.u{text-decoration:underline}

/* ---------- barre d'outils (gros boutons) ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:stretch;gap:1px;padding:3px 2px;flex:none;border-top:1px solid var(--shadow);border-bottom:1px solid var(--shadow);box-shadow:inset 0 1px var(--light),0 1px var(--light)}
.tool{min-width:76px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:1px solid transparent;padding:2px 6px}
.tool:hover:not(:disabled){border-color:var(--light) var(--shadow) var(--shadow) var(--light)}
.tool:active:not(:disabled){border-color:var(--shadow) var(--light) var(--light) var(--shadow)}
.tool .i{font-size:22px;line-height:1}
.tool:disabled{color:var(--shadow);text-shadow:1px 1px var(--light)}
.tool:disabled .i{filter:grayscale(1);opacity:.45}
.tsep{width:2px;margin:3px 3px;border-left:1px solid var(--shadow);border-right:1px solid var(--light)}
.tool.save:not(:disabled) .lbl{font-weight:bold}

/* ---------- zone principale ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:5px;padding:5px 2px 3px}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.caption{background:linear-gradient(90deg,#5E6E8C,#A9B6CC);color:#fff;font-weight:bold;padding:3px 6px;flex:none;display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden}
.search{display:flex;align-items:center;gap:6px;padding:5px 2px;flex:none}
.search input{flex:1;min-width:0}
.list{flex:1;min-height:0;overflow:auto;background:#fff}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{background:#fff;border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);box-shadow:inset 1px 1px var(--dark),inset -1px -1px var(--face-hi);padding:2px 4px;height:22px;border-radius:0;outline:none}
input:focus,select:focus,textarea:focus{outline:1px dotted #000;outline-offset:1px}
input[readonly]{background:var(--face-hi)}
input[type=number]{width:92px;text-align:right}
textarea{height:auto;font:11px "Courier New",Courier,monospace;width:100%;resize:vertical}
input[type=checkbox]{width:13px;height:13px;accent-color:var(--sel)}

/* grilles (listes) */
table.grid{border-collapse:separate;border-spacing:0;width:100%;background:#fff}
.grid th{position:sticky;top:0;z-index:1;background:var(--face);font-weight:normal;text-align:left;padding:2px 6px;white-space:nowrap;border:1px solid;border-color:var(--light) var(--shadow) var(--shadow) var(--light);user-select:none}
.grid th.sort{cursor:pointer}
.grid th.sort:active{border-color:var(--shadow) var(--light) var(--light) var(--shadow)}
.grid th .ar{font-size:9px;margin-left:4px}
.grid td{padding:2px 6px;border-bottom:1px solid #E4E4E4;white-space:nowrap}
.grid tbody tr:nth-child(even) td{background:var(--zebra)}
.grid tbody tr.click{cursor:pointer}
.grid tbody tr.click:hover td{background:var(--hover)}
.grid tbody tr.sel td,.grid tbody tr.sel:hover td{background:var(--sel);color:var(--sel-t)}
.grid tbody tr.sel:focus-visible{outline:1px dotted #fff;outline-offset:-2px}
.grid td.n,.grid th.n{text-align:right;font-variant-numeric:tabular-nums}
.grid td.c,.grid th.c{text-align:center}
.grid .sub td{background:#E6E3DB!important;font-weight:bold;color:#202020}
.grid .muted{color:var(--shadow)}
.grid tr.sel .muted{color:#C9D3EE}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.dot.on{background:#21A33A}.dot.mid{background:#E0A800}.dot.off{background:#B7B7B7}

/* onglets façon « feuille de propriétés » */
.tabs{display:flex;flex-wrap:wrap;padding:6px 6px 0;flex:none;gap:0}
.tab{background:var(--face);border:1px solid;border-color:var(--light) var(--dark) transparent var(--light);border-radius:3px 3px 0 0;padding:3px 11px;margin:2px -1px 0 0;position:relative;top:1px;box-shadow:inset -1px 0 var(--shadow)}
.tab[aria-selected=true]{margin-top:0;padding-bottom:5px;z-index:2;background:var(--face)}
.tab:disabled{color:var(--shadow);text-shadow:1px 1px var(--light)}
.tab:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.sheet{flex:1;min-height:0;overflow:auto;padding:10px;margin:0 6px 4px;border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);box-shadow:inset -1px -1px var(--shadow)}
.fiche-h{display:flex;align-items:center;gap:12px;padding:2px 0 8px}
.fiche-h .av{font-size:38px;line-height:1;width:58px;height:58px;display:grid;place-items:center;background:#fff;position:relative}
.fiche-h .av .h{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:20px}
.fiche-h .av .a{position:absolute;right:-6px;bottom:-4px;font-size:18px}
.fiche-h b{font-size:16px}
.fiche-h .who{display:flex;flex-direction:column;gap:2px;min-width:0}
fieldset{border:1px solid var(--shadow);box-shadow:inset 1px 1px var(--light),1px 1px var(--light);margin:0 0 10px;padding:6px 10px 9px;min-width:0}
legend{padding:0 4px;color:#00248F}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:0 10px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:6px;margin:5px 0}
.row>label,.row>.l{white-space:nowrap}
.row .v{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-width:0}
.row .v code{font:11px "Courier New",monospace;word-break:break-all}
.btn.mini{min-width:0;height:21px;padding:0 7px}
.btn.mini:active:not(:disabled){padding:1px 6px 0 8px}
.info{background:var(--tip);border:1px solid #000;padding:6px 8px;margin:0 0 10px;line-height:1.45}
.warn{color:var(--red)}
.okc{color:var(--green)}
.btn{min-width:78px;height:23px;padding:0 10px;background:var(--face);border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);box-shadow:inset -1px -1px var(--shadow),inset 1px 1px var(--face-hi);white-space:nowrap}
.btn:active:not(:disabled){border-color:var(--dark) var(--light) var(--light) var(--dark);box-shadow:inset 1px 1px var(--shadow);padding:1px 9px 0 11px}
.btn:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.btn.def{outline:1px solid #000;outline-offset:0}
.btn:disabled{color:var(--shadow);text-shadow:1px 1px var(--light)}
.btn.danger{color:var(--red)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:6px 6px 2px}
.stat{font-variant-numeric:tabular-nums}
.empty{padding:28px 14px;text-align:center;color:#333}
.empty .big{font-size:40px;display:block;margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:0 0 10px}
.kv>div{background:#fff;padding:6px 8px}
.kv b{display:block;font-size:17px;font-variant-numeric:tabular-nums}

/* barre d'état */
.status{display:flex;gap:2px;flex:none;padding-top:2px;min-width:0}
.status>div{padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .s1{flex:1;min-width:0}
.status .dirty{color:var(--red);font-weight:bold}

/* barre des tâches */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:30px;background:var(--face);display:flex;align-items:center;gap:4px;padding:2px 3px;border-top:1px solid var(--light);box-shadow:0 -1px var(--face-hi);z-index:40}
.start{font-weight:bold;height:24px;display:flex;align-items:center;gap:5px;padding:0 7px;background:var(--face)}
.task{height:24px;flex:0 1 240px;min-width:0;display:flex;align-items:center;gap:5px;padding:0 6px;background:var(--face);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.task.on{border-color:var(--dark) var(--light) var(--light) var(--dark);box-shadow:inset 1px 1px var(--shadow);background:repeating-conic-gradient(var(--face-hi) 0 25%,var(--face) 0 50%) 0 0/2px 2px;font-weight:bold}
.clock{margin-left:auto;padding:0 10px;height:22px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.startmenu{position:fixed;left:2px;bottom:30px;z-index:70;background:var(--face);display:flex;min-width:230px;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.startmenu .side{width:24px;background:linear-gradient(0deg,var(--t1),#1C5FCF);color:#fff;font-weight:bold;writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 3px;letter-spacing:1px;white-space:nowrap}
.startmenu .items{flex:1;padding:2px}
.startmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:7px 12px;text-align:left}
.startmenu button .emo{font-size:20px}
.startmenu button:hover{background:var(--sel);color:#fff}

/* boîtes de dialogue */
.dlg-back{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:12px;background:rgba(0,0,0,.08)}
.dlg{width:min(460px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--face);padding:3px;box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.dlg.wide{width:min(720px,100%)}
.dlg .body{display:flex;gap:14px;padding:14px 12px 10px;overflow:auto;line-height:1.45}
.dlg .ico{font-size:32px;line-height:1;flex:none}
.dlg .txt{flex:1;min-width:0}
.dlg .txt p{margin:0 0 8px}
.dlg .btns{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:4px 10px 10px;flex:none}
.dlg .fld{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:6px;margin:6px 0}
.dlg .fld input{width:100%}
.dlg .fld input[type=checkbox]{width:auto}
.dlg .fld label.ck{display:inline-flex;align-items:center;gap:6px}
.dlg .err{color:var(--red);min-height:1.4em;margin:4px 0 0}
.dlg ol{margin:6px 0 8px;padding-left:20px}
.dlg ol li{margin:3px 0}
.logo{display:flex;align-items:center;gap:12px;padding:12px 12px 4px}
.logo .emo{font-size:40px}
.logo b{font-size:18px;display:block}
.logo span{color:#333}
.progress{height:16px;background:#fff;padding:2px;margin:8px 0 0}
.progress i{display:block;height:100%;width:40%;background:repeating-linear-gradient(90deg,var(--sel) 0 9px,transparent 9px 11px);animation:load 1.2s linear infinite}
@keyframes load{from{margin-left:-40%}to{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.progress i{animation:none;width:100%}}

@media (max-width:760px){
  body{overflow:auto}
  .win,.win.max{position:relative;inset:auto;min-height:calc(100vh - 30px);margin:0 0 30px}
  .main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .pane.left .list{max-height:38vh;min-height:150px}
  .pane.right{min-height:460px}
  .tool{min-width:60px;height:46px;padding:2px 3px}
  .tool .lbl{font-size:11px}
  .tsep{display:none}
  .row{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .status .s3,.status .s4{display:none}
  .task{flex-basis:150px}
}
</style>
<script src="firebase-config.js" onerror="window.__cfgMissing=true"></script>
</head>
<body>

<!-- ======================= la fenêtre principale ======================= -->
<div class="win raised" id="win" hidden>
  <div class="titlebar" id="titlebar">
    <span class="tico emo">🥨</span>
    <span class="tt" id="wtitle">Bretzel Admin – Opération Bretzel – Mode administrateur</span>
    <button class="tbtn raised" data-act="win-min" title="Réduire" aria-label="Réduire">_</button>
    <button class="tbtn raised" data-act="win-max" title="Agrandir" aria-label="Agrandir">□</button>
    <button class="tbtn raised" data-act="logout" title="Fermer (se déconnecter)" aria-label="Fermer et se déconnecter">✕</button>
  </div>
  <nav class="menubar" id="menubar" aria-label="Menu">
    <div class="m" data-menu="fichier"><button data-act="menu" data-m="fichier"><span class="u">F</span>ichier</button></div>
    <div class="m" data-menu="edition"><button data-act="menu" data-m="edition"><span class="u">É</span>dition</button></div>
    <div class="m" data-menu="affichage"><button data-act="menu" data-m="affichage"><span class="u">A</span>ffichage</button></div>
    <div class="m" data-menu="joueur"><button data-act="menu" data-m="joueur"><span class="u">J</span>oueur</button></div>
    <div class="m" data-menu="aide"><button data-act="menu" data-m="aide"><span class="u">?</span></button></div>
  </nav>
  <div class="toolbar" role="toolbar" aria-label="Outils">
    <button class="tool" data-act="refresh" title="Recharger toutes les progressions (F5)"><span class="i emo">🔄</span><span class="lbl">Actualiser</span></button>
    <span class="tsep"></span>
    <button class="tool save" data-act="save" id="t-save" title="Enregistrer la fiche (Ctrl+S)"><span class="i emo">💾</span><span class="lbl">Enregistrer</span></button>
    <button class="tool" data-act="cancel" id="t-cancel" title="Annuler les modifications de la fiche"><span class="i emo">↩️</span><span class="lbl">Annuler</span></button>
    <button class="tool" data-act="reset" id="t-reset" title="Remettre à zéro la progression du joueur"><span class="i emo">🧹</span><span class="lbl">Remise à zéro</span></button>
    <span class="tsep"></span>
    <button class="tool" data-act="tab" data-tab="ens" title="Vue d'ensemble de tous les joueurs"><span class="i emo">📊</span><span class="lbl">Ensemble</span></button>
    <button class="tool" data-act="export" title="Exporter la liste (tableur)"><span class="i emo">📤</span><span class="lbl">Exporter</span></button>
    <button class="tool" data-act="journal" title="Journal des modifications"><span class="i emo">📒</span><span class="lbl">Journal</span></button>
    <span class="tsep"></span>
    <button class="tool" data-act="help" title="Aide"><span class="i emo">❓</span><span class="lbl">Aide</span></button>
    <button class="tool" data-act="logout" title="Se déconnecter"><span class="i emo">🚪</span><span class="lbl">Quitter</span></button>
  </div>
  <div class="main">
    <section class="pane left" aria-label="Liste des joueurs">
      <div class="caption"><span>Joueurs</span><span id="cnt">0</span></div>
      <div class="search"><label for="q">Rechercher :</label><input type="search" id="q" placeholder="pseudo…" autocomplete="off"></div>
      <div class="list sunken" id="list"></div>
    </section>
    <section class="pane right" aria-label="Fiche">
      <div class="caption"><span id="ftitle">Vue d'ensemble</span><span id="fsub"></span></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="sheet" id="sheet" role="tabpanel"></div>
      <div class="btnrow" id="fbtns"></div>
    </section>
  </div>
  <div class="status" id="status">
    <div class="s1 sunken" id="st1">Prêt</div>
    <div class="s2 sunken" id="st2"></div>
    <div class="s3 sunken" id="st3"></div>
    <div class="s4 sunken" id="st4"></div>
  </div>
</div>

<div class="taskbar" id="taskbar">
  <button class="start raised" data-act="start"><span class="emo">🥨</span> Démarrer</button>
  <button class="task raised" id="task" data-act="task"><span class="emo">🛠️</span> <span id="tasklbl">Bretzel Admin</span></button>
  <div class="clock sunken" id="clock">--:--</div>
</div>
<div id="layer"></div>

<script>
'use strict';
/* =========================================================
   Bretzel Admin : console d'administration d'Opération Bretzel
   Voir et modifier la progression des joueurs (Firestore « joueurs/{uid} »).
   L'accès est contrôlé par les règles Firestore : seuls les comptes administrateurs
   (leur identifiant technique est dans les règles) peuvent lire les autres fiches.
   ========================================================= */

function authMsg(e){
  const c=String((e&&e.code)||'');
  if(/invalid-credential|wrong-password|user-not-found|invalid-login-credentials|invalid-email|user-mismatch/.test(c))return 'Identifiant ou mot de passe incorrect.';
  if(c.includes('too-many-requests'))return 'Trop d\'essais. Attends quelques minutes, puis réessaie.';
  if(c.includes('network-request-failed'))return 'Pas de connexion internet ? Vérifie ta connexion, puis réessaie.';
  if(/api-key-not-valid|invalid-api-key/.test(c))return 'La configuration Firebase est incorrecte (firebase-config.js).';
  return 'La connexion a échoué ('+(c||'erreur inconnue')+').';
}
function fsMsg(e){
  const c=String((e&&e.code)||'');
  if(c==='permission-denied')return 'Accès refusé par Firestore : les règles de sécurité ne te reconnaissent pas comme administrateur.';
  if(c==='unavailable'||c==='deadline-exceeded')return 'Pas de connexion avec la base. Vérifie internet, puis réessaie.';
  if(c==='unauthenticated')return 'Ta session a expiré : reconnecte-toi.';
  if(c==='not-found')return 'La base Firestore est introuvable.';
  return 'Erreur de la base ('+(c||'inconnue')+').';
}

    const prevFocus=document.activeElement;
    const done=v=>{back.remove();document.removeEventListener('keydown',key,true);try{prevFocus&&prevFocus.focus&&prevFocus.focus();}catch(e){}res(v);};
    const key=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(cancel===null?buttons.length-1:cancel);}};
    back.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b&&!b.disabled)done(+b.dataset.i);else if(e.target.closest('[data-x]'))done(cancel===null?buttons.length-1:cancel);});
    document.addEventListener('keydown',key,true);
    $('#layer').appendChild(back);
    if(onOpen)onOpen(back,done);
    const f=back.querySelector('input')||back.querySelector('.btn.def');if(f)setTimeout(()=>f.focus(),20);
  });
}

    const [appM,A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore-lite.js')]);
    S.A=A;S.F=F;
    const app=appM.initializeApp(FB_CFG,'bretzel-admin');
    /* session limitée à l'onglet : on est déconnecté en le fermant */
    S.auth=A.initializeAuth(app,{persistence:[A.browserSessionPersistence]});
    S.db=F.getFirestore(app);
    const em=window.FIREBASE_EMULATORS;
    if(em){A.connectAuthEmulator(S.auth,em.auth,{disableWarnings:true});F.connectFirestoreEmulator(S.db,em.firestore[0],em.firestore[1]);}
    A.onAuthStateChanged(S.auth,u=>{S.user=u;if(u)onLogin();else{S.players=[];S.sel=null;S.orig=S.edit=null;S.loaded=false;showLogin();}});

/* ---------- les règles Firestore à coller pour devenir administrateur ---------- */
function rulesText(uid,pseudo){
  return `rules_version = '2';

// Règles de sécurité d'Opération Bretzel, avec la console d'administration (admin.html).
// À coller dans la console Firebase : Firestore Database > onglet « Règles » > Publier.
//
// Chaque joueur ne peut lire, modifier et supprimer QUE sa propre progression.
// Les administrateurs peuvent voir et modifier toutes les progressions,
// mais ils ne peuvent ni les supprimer ni changer les pseudos.
service cloud.firestore {
  match /databases/{database}/documents {

    // Administrateur(s) : identifiant technique du compte « ${pseudo.replace(/[^a-z0-9_-]/g,'')} »
    function estAdmin() {
      return request.auth != null && request.auth.uid in ['${uid}'];
    }

    match /joueurs/{uid} {
      allow read, delete: if request.auth != null && request.auth.uid == uid;
      allow create, update: if request.auth != null
                            && request.auth.uid == uid
                            && request.resource.data.keys().hasOnly(['pseudo', 'progress', 'updatedAt'])
                            && request.resource.data.progress is map;

      allow read: if estAdmin();
      allow update: if estAdmin()
                    && request.resource.data.keys().hasOnly(['pseudo', 'progress', 'updatedAt'])
                    && request.resource.data.progress is map
                    && request.resource.data.pseudo == resource.data.pseudo;
    }
  }
}
`;
}

        try{await navigator.clipboard.writeText(rules);ok=true;}catch(x){}
        if(!ok){const ta=back.querySelector('#rules');ta.focus();ta.select();try{ok=document.execCommand('copy');}catch(x){}}
        msg.className=ok?'okc':'err';msg.textContent=ok?'✅ Règles copiées ! Colle-les dans Firebase (onglet Règles), puis clique sur Publier.':'Je n\'ai pas pu copier : sélectionne le texte ci-dessus, puis Ctrl+C.';
      });
      back.querySelector('[data-i="1"]').addEventListener('click',e=>{e.stopPropagation();window.open(url,'_blank','noopener');});
    }});
  if(v===2){const ok=await loadPlayers(true);if(ok!==false)showWin();return;}
  try{await S.A.signOut(S.auth);}catch(e){showLogin();}
}
function showWin(){hideLogin();$('#win').hidden=false;$('#task').classList.add('on');render();}

   Lecture des progressions
   ========================================================= */
async function loadPlayers(first){
  setStatus('Chargement des progressions…');
  try{
    const snap=await S.F.getDocs(S.F.collection(S.db,'joueurs'));
    const list=[];
    snap.forEach(d=>{const x=d.data()||{};list.push({uid:d.id,pseudo:x.pseudo,progress:obj(x.progress),updatedAt:num(x.updatedAt)});});
    S.players=list;S.loaded=true;S.lastLoad=Date.now();
    if(S.sel){const p=cur();if(p){if(!dirty()){S.orig=clone(p.progress);S.edit=clone(p.progress);}}else{S.sel=null;S.orig=S.edit=null;S.tab='ens';}}
    setStatus(`${list.length} joueur${list.length>1?'s':''} chargé${list.length>1?'s':''} à ${fmtTime(Date.now())}`);
    return true;
  }catch(e){
    if(String(e&&e.code)==='permission-denied'){hideLogin();await notAdmin();return false;}
    setStatus(fsMsg(e));
    if(first){showLogin(fsMsg(e));return false;}
    await box({title:'Erreur',icon:'⛔',html:`<p>${esc(fsMsg(e))}</p>`});
    return false;
  }
}

}
async function pick(uid){
  if(uid===S.sel){if(S.tab==='ens'){S.tab='gen';render();}return;}
  if(!await askSave())return;
  const p=S.players.find(x=>x.uid===uid);if(!p)return;
  S.sel=uid;S.orig=clone(p.progress);S.edit=clone(p.progress);S.ghostSel=new Set();
  if(S.tab==='ens')S.tab='gen';
  render();setStatus(`Fiche de ${p.pseudo||'?'} ouverte`);
}
function summary(a,b){
  const out=[];
  if(num(a.xp)!==num(b.xp))out.push(`XP ${fmtN(a.xp)} → ${fmtN(b.xp)}`);
  if(num(obj(a.shop).bonus)!==num(obj(b.shop).bonus))out.push(`bretzels offerts ${num(obj(a.shop).bonus)} → ${num(obj(b.shop).bonus)}`);
  const sa=obj(a.stars),sb=obj(b.stars);for(const w of new Set([...Object.keys(sa),...Object.keys(sb)]))if(JSON.stringify(sa[w])!==JSON.stringify(sb[w]))out.push(`${wname(w)} : ${w in sa?sa[w]+'★':'—'} → ${w in sb?sb[w]+'★':'—'}`);
  const ga=Object.keys(obj(a.ghosts)).length,gb=Object.keys(obj(b.ghosts)).length;if(ga!==gb)out.push(`fantômes ${ga} → ${gb}`);
  const ba=Object.keys(obj(a.badges)),bb=Object.keys(obj(b.badges));if(JSON.stringify(ba.sort())!==JSON.stringify(bb.sort()))out.push(`badges ${ba.length} → ${bb.length}`);
  if(JSON.stringify(obj(a.streak))!==JSON.stringify(obj(b.streak)))out.push(`série ${num(obj(a.streak).days)} → ${num(obj(b.streak).days)} j`);
  for(const k of Object.keys(DATA.bosses))if(winsOf(a,k)!==winsOf(b,k))out.push(`${DATA.bosses[k].n} ${winsOf(a,k)} → ${winsOf(b,k)}`);
  if(b.__reset)out.unshift('remise à zéro');
  return out.length?out.join(', '):'aucun changement visible';
}
async function save(){
  const p=cur();if(!p||!dirty()||S.busy)return true;
  S.busy=true;setStatus('Enregistrement…');
  try{
    /* quelqu'un a-t-il joué depuis l'ouverture de la fiche ? */
    const snap=await S.F.getDoc(S.F.doc(S.db,'joueurs',p.uid));
    const live=snap.exists()?snap.data():null;
    if(live&&num(live.updatedAt)!==num(p.updatedAt)){
      S.busy=false;
      const v=await box({title:'Conflit',icon:'⚠️',html:`<p><b>${esc(p.pseudo||'?')}</b> a joué pendant que tu modifiais sa fiche (dernière activité : ${esc(fmtDate(live.updatedAt))}).</p><p>Si tu enregistres quand même, ce qu'il vient de gagner sera remplacé par ta version.</p>`,buttons:['Recharger sa fiche','Enregistrer quand même','Annuler'],def:0,cancel:2});
      if(v===2){setStatus('Enregistrement annulé');return false;}
      if(v===0){p.progress=obj(live.progress);p.updatedAt=num(live.updatedAt);S.orig=clone(p.progress);S.edit=clone(p.progress);render();setStatus(`Fiche de ${p.pseudo} rechargée`);return false;}
      S.busy=true;
    }
    const before=S.orig,prog=clone(S.edit),t=Date.now();
    const sum=summary(before,prog);delete prog.__reset;
    prog.adminAt=t;prog.updatedAt=t;
    await S.F.setDoc(S.F.doc(S.db,'joueurs',p.uid),{pseudo:p.pseudo,progress:prog,updatedAt:t});
    p.progress=prog;p.updatedAt=t;S.orig=clone(prog);S.edit=clone(prog);S.ghostSel=new Set();
    addLog(`${p.pseudo} : ${sum}`);
    setStatus(`Fiche de ${p.pseudo} enregistrée à ${fmtTime(t)}`);
    return true;
  }catch(e){
    await box({title:'Erreur',icon:'⛔',html:`<p>L'enregistrement a échoué.</p><p>${esc(fsMsg(e))}</p>`});
    setStatus('Échec de l\'enregistrement');return false;
  }finally{S.busy=false;render();}
}
function cancel(){if(!dirty())return;S.edit=clone(S.orig);S.ghostSel=new Set();render();setStatus('Modifications annulées');}
async function resetPlayer(){
  const p=cur();if(!p)return;
  const name=p.pseudo||'';
  const v=await box({title:'Remise à zéro',icon:'⚠️',buttons:['Remettre à zéro','Annuler'],def:1,cancel:1,
    html:`<p>Tout effacer pour <b>${esc(name)}</b> : XP, étoiles, fantômes, badges, série, boss, carte et objets achetés ?</p>
    <p>Pour confirmer, écris son pseudo :</p><input type="text" id="rz" autocomplete="off" spellcheck="false" style="width:100%">
    <p class="muted" style="margin-top:6px">Rien n'est effacé tant que tu n'as pas cliqué sur <b>Enregistrer</b>.</p>`,
    onOpen:(back)=>{const b=back.querySelector('[data-i="0"]');b.disabled=true;back.querySelector('#rz').addEventListener('input',e=>{b.disabled=pseudoKey(e.target.value)!==pseudoKey(name);});}});
  if(v!==0)return;
  const keep=obj(S.edit.settings);
  const f=clone(DATA.fresh);
  delete f.rev;delete f.syncedRev;delete f.syncBase;
  f.settings=Object.assign({},f.settings,keep);f.seenIntro=true;f.news=DATA.news;f.__reset=true;
  S.edit=f;S.ghostSel=new Set();S.tab='gen';render();
  setStatus(`Remise à zéro préparée pour ${name} : clique sur Enregistrer pour confirmer`);
}
function addLog(t){S.log.unshift({t:Date.now(),m:t});if(S.log.length>200)S.log.pop();}
function showJournal(){
  box({title:'Journal des modifications (cette session)',icon:'📒',wide:true,
    html:S.log.length?`<div class="list sunken" style="max-height:50vh"><table class="grid"><thead><tr><th scope="col">Heure</th><th scope="col">Action</th></tr></thead><tbody>${S.log.map(l=>`<tr><td>${fmtTime(l.t)}</td><td style="white-space:normal">${esc(l.m)}</td></tr>`).join('')}</tbody></table></div>`:'<p>Aucune action pour l\'instant.</p>'});
}
function csvCell(v){let s=String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return /[";\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}
function exportCsv(){
  const head=['pseudo','xp','rang','bretzels','etoiles','fantomes','serie_jours','badges','carte','derniere_activite'];
  const rows=sorted().map(p=>{const g=p.progress,m=mapOf(g);return [p.pseudo||'',num(g.xp),rankOf(g.xp).de,coinsOf(g),starsOf(g),ghostsOf(g),num(obj(g.streak).days),badgesOf(g),`${m.done}/${m.total}`,fmtDate(p.updatedAt)];});
  const csv=[head,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const d=new Date();a.download=`joueurs-operation-bretzel-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.csv`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  addLog('Export de la liste des joueurs');setStatus('Liste exportée');
}
async function refresh(){
  if(dirty()){const v=await box({title:'Actualiser',icon:'❓',html:'<p>Ta fiche a des modifications non enregistrées. Les garder pendant l\'actualisation ?</p>',buttons:['Garder','Les abandonner','Annuler'],def:0,cancel:2});if(v===2)return;if(v===1)S.edit=clone(S.orig);}
  const ok=await loadPlayers(false);if(ok)render();
}
async function logout(){
  if(!await askSave())return;
  const v=await box({title:'Quitter',icon:'❓',html:'<p>Se déconnecter de la console d\'administration ?</p>',buttons:['Oui','Non'],def:0,cancel:1});
  if(v!==0)return;
  addLog('Déconnexion');
  try{await S.A.signOut(S.auth);}catch(e){showLogin();}
}
function help(){
  box({title:'Aide – Bretzel Admin',icon:'❓',wide:true,html:`<p><b>À quoi sert cette console ?</b> À voir la progression de tous les joueurs d'Opération Bretzel et à corriger une fiche si besoin.</p>
  <ol><li>Choisis un joueur dans la liste de gauche (ou dans la <b>Vue d'ensemble</b>).</li>
  <li>Modifie sa fiche dans les onglets <b>Général</b>, <b>Missions</b>, <b>Fantômes</b> ou <b>Badges</b>. Un ✎ rouge montre ce qui a changé.</li>
  <li>Clique sur <b>Enregistrer</b> (ou Ctrl+S). Rien n'est envoyé avant.</li></ol>
  <p>La prochaine fois que le joueur ouvre le jeu (ou dès sa prochaine sauvegarde), il reçoit ta version et un petit message lui dit que l'administrateur a mis sa progression à jour.</p>
  <p><b>Raccourcis :</b> F5 = actualiser, Ctrl+S = enregistrer, Échap = fermer une fenêtre.</p>
  <p class="muted">Les mots de passe ne sont jamais visibles, ni ici ni dans la base. Personne ne peut supprimer un compte depuis cette console.</p>`});
}
function about(){box({title:'À propos de Bretzel Admin',icon:'🥨',html:`<p><b>Bretzel Admin</b> – version 1.0<br>Console d'administration d'Opération Bretzel.</p><p class="muted">Base : ${esc(FB_CFG?FB_CFG.projectId:'?')}<br>Connecté : ${esc(me())}</p>`});}

/* ---------- menus ---------- */
const MENUS={
  fichier:()=>[['🔄 Actualiser','F5','refresh'],['📤 Exporter la liste…','','export'],'-',['🎮 Ouvrir le jeu','','game'],'-',['🚪 Se déconnecter','','logout']],
  edition:()=>[['💾 Enregistrer','Ctrl+S','save',!dirty()],['↩️ Annuler les modifications','','cancel',!dirty()],'-',['👻 Supprimer tous les fantômes','','gdelall',!cur()]],
  affichage:()=>[['📊 Vue d\'ensemble','','tab:ens'],'-',['Trier par pseudo','','sort:pseudo'],['Trier par XP','','sort:xp'],['Trier par activité','','sort:act'],'-',['📒 Journal des modifications','','journal']],
  joueur:()=>[['Général','','tab:gen',!cur()],['Missions','','tab:mis',!cur()],['Fantômes','','tab:fan',!cur()],['Badges','','tab:bad',!cur()],['Boutique','','tab:bou',!cur()],'-',['🧹 Remettre à zéro…','','reset',!cur()],['Fermer la fiche','','close',!cur()]],
  aide:()=>[['❓ Aide','F1','help'],['🥨 À propos de Bretzel Admin','','about']]
};
function closeMenus(){document.querySelectorAll('.menubar .m.open').forEach(m=>{m.classList.remove('open');const x=m.querySelector('.menu');if(x)x.remove();});const sm=$('.startmenu');if(sm)sm.remove();}
function openMenu(name){
  const m=document.querySelector(`.menubar .m[data-menu="${name}"]`);const was=m.classList.contains('open');closeMenus();if(was)return;
  m.classList.add('open');
  const div=document.createElement('div');div.className='menu raised';div.setAttribute('role','menu');
  div.innerHTML=MENUS[name]().map(it=>it==='-'?'<hr>':`<button role="menuitem" data-act="mi" data-do="${it[2]}" ${it[3]?'disabled':''}><span>${esc(it[0])}</span><span class="k">${esc(it[1])}</span></button>`).join('');
  m.appendChild(div);const f=div.querySelector('button:not(:disabled)');if(f)f.focus();
}
function startMenu(){
  if($('.startmenu')){closeMenus();return;}closeMenus();
  const d=document.createElement('div');d.className='startmenu raised';
  d.innerHTML=`<div class="side">Bretzel Admin</div><div class="items"><button data-act="mi" data-do="game"><span class="emo">🎮</span>Ouvrir le jeu</button><button data-act="mi" data-do="tab:ens"><span class="emo">📊</span>Vue d'ensemble</button><button data-act="mi" data-do="help"><span class="emo">❓</span>Aide</button><hr style="border:0;border-top:1px solid var(--shadow);border-bottom:1px solid var(--light);margin:2px"><button data-act="mi" data-do="logout"><span class="emo">🚪</span>Se déconnecter…</button></div>`;
  document.body.appendChild(d);
}
async function doAction(a){
  closeMenus();
  if(a.startsWith('tab:'))return setTab(a.slice(4));
  if(a.startsWith('sort:')){const k=a.slice(5);S.sort={k,d:k==='pseudo'?1:-1};return render();}
  ({refresh,export:exportCsv,game:()=>window.open('./','_blank','noopener'),logout,save,cancel,reset:resetPlayer,journal:showJournal,help,about,
    gdelall:()=>delGhosts(true),close:closeFiche})[a]?.();
}
function setTab(t){if(t!=='ens'&&!cur())return;S.tab=t;renderTabs();renderSheet();renderTools();$('#sheet').scrollTop=0;}
async function closeFiche(){if(!await askSave())return;S.sel=null;S.orig=S.edit=null;S.tab='ens';render();}
async function delGhosts(all){
  const g=S.edit;if(!g)return;const gh=obj(g.ghosts);const ids=all?Object.keys(gh):[...S.ghostSel].filter(i=>i in gh);
  if(!ids.length)return;
  if(all){const v=await box({title:'Fantômes',icon:'❓',html:`<p>Supprimer les <b>${ids.length}</b> fantôme${ids.length>1?'s':''} de ${esc(cur().pseudo||'?')} ?</p>`,buttons:['Oui','Non'],def:1,cancel:1});if(v!==0)return;}
  g.ghosts=Object.fromEntries(Object.entries(gh).filter(([k])=>!ids.includes(k)));
  S.ghostSel=new Set();S.tab='fan';render();
}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(!e.target.closest('.menu,.startmenu'))closeMenus();return;}
  const a=t.dataset.act;
  if(a==='menu'){e.stopPropagation();return openMenu(t.dataset.m);}
  if(a==='start'){e.stopPropagation();return startMenu();}
  if(a==='mi')return doAction(t.dataset.do);
  closeMenus();
  if(a==='pick')return pick(t.dataset.uid);
  if(a==='sort'){const k=t.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==='pseudo'?1:-1};return render();}
  if(a==='tab')return setTab(t.dataset.tab);
  if(a==='xp'){S.edit.xp=int(num(S.edit.xp)+num(t.dataset.v),0,1e6);const i=$('#f-xp');if(i)i.value=S.edit.xp;return renderSheet(),refreshLive();}
  if(a==='bonus'){S.edit.shop=obj(S.edit.shop);S.edit.shop.bonus=int(num(S.edit.shop.bonus)+num(t.dataset.v),0,1e5);return renderSheet(),refreshLive();}
  if(a==='gdel')return delGhosts(false);
  if(a==='gall')return;
  if(a==='win-max'){$('#win').classList.toggle('max');return;}
  if(a==='win-min'){$('#win').hidden=true;$('#task').classList.remove('on');return;}
  if(a==='task'){const w=$('#win');if(!S.user)return;w.hidden=!w.hidden;$('#task').classList.toggle('on',!w.hidden);return;}
  return doAction(a);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('tr[data-act=pick]')){e.preventDefault();pick(e.target.dataset.uid);}
  if(!S.user||$('.dlg-back:not([style])'))return;
  if(e.key==='F5'){e.preventDefault();refresh();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();}
  else if(e.key==='F1'){e.preventDefault();help();}
  else if(e.key==='Escape')closeMenus();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;renderList();if(S.tab==='ens')renderSheet();return;}
  const f=t.dataset.f;if(!f||!S.edit)return;
  const g=S.edit;
  if(f==='xp')g.xp=int(t.value,0,1e6);
  else if(f==='bonus'){g.shop=obj(g.shop);g.shop.bonus=int(t.value,0,1e5);}
  else if(f==='streak.days'||f==='streak.best'){g.streak=Object.assign({days:0,best:0,last:''},obj(g.streak));g.streak[f.split('.')[1]]=int(t.value,0,3650);}
  else if(f.startsWith('boss.')){const k=f.slice(5);g.boss=obj(g.boss);const c=obj(g.boss[k]);const w=int(t.value,0,1000);g.boss[k]=Object.assign({},c,{wins:w,tries:Math.max(num(c.tries),w)});}
  refreshLive();
});
document.addEventListener('change',e=>{
  const t=e.target;if(!S.edit)return;const g=S.edit;
  if(t.dataset.star!==undefined){const w=t.dataset.star,v=+t.value;g.stars=obj(g.stars);if(v<0)delete g.stars[w];else g.stars[w]=v;renderSheet();refreshLive();return;}
  if(t.dataset.ghost!==undefined){t.checked?S.ghostSel.add(t.dataset.ghost):S.ghostSel.delete(t.dataset.ghost);renderSheet();return;}
  if(t.dataset.act==='gall'){const ids=Object.keys(obj(g.ghosts));S.ghostSel=t.checked?new Set(ids):new Set();renderSheet();return;}
  if(t.dataset.badge!==undefined){const id=t.dataset.badge;g.badges=obj(g.badges);if(t.checked)g.badges[id]=num(obj(S.orig.badges)[id])||Date.now();else delete g.badges[id];renderSheet();refreshLive();return;}
  if(t.dataset.f){renderSheet();}
});
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
function tick(){const d=new Date();$('#clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;}
init();
</script>
</body>
</html>
